<style>
:root{
 --bg:#F2F4EF; --surface:#FFFFFF; --ink:#0F1913; --mut:#5B6961; --line:#E5E9E0; --line2:#CDD5C8;
 --green:#0E5C3E; --green-d:#0A3F2A; --green-t:#E1F0E6; --eco:#149A5C; --teal:#0E8F86;
 --amber:#C98A2B; --amber-t:#F7EDDA;
 --red:#B5473A; --red-t:#F6E3E0; --blue:#2F6B9E; --blue-t:#E3EDF6; --yellow:#A98A1F; --yellow-t:#F4EED3;
 --grad:linear-gradient(120deg,#0E5C3E 0%,#176B58 100%);
 --disp:"Sora",sans-serif; --body:"Figtree",sans-serif;
 --r:12px; --r-lg:20px; --sh:0 1px 2px rgba(15,25,19,.05),0 1px 1px rgba(15,25,19,.04); --sh2:0 22px 44px -20px rgba(15,25,19,.30);
 --ring:0 0 0 3px rgba(20,154,92,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);
 color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%} a{color:inherit;text-decoration:none} button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:var(--ring)}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--disp);line-height:1.15;letter-spacing:-.01em}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:12px} .mt1{margin-top:8px}.mt2{margin-top:16px}.mt3{margin-top:26px}.mb2{margin-bottom:16px}
.link{color:var(--green);font-weight:600;font-size:13.5px}.link:hover{text-decoration:underline}
.kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--eco)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;padding:12px 20px;border-radius:9px;border:1.5px solid transparent;transition:.2s cubic-bezier(.2,.7,.3,1);white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-green{background:var(--grad);color:#fff;box-shadow:0 1px 2px rgba(15,25,19,.08)}.btn-green:hover{filter:brightness(1.06);transform:translateY(-1.5px);box-shadow:var(--sh2)}
.btn-ink{background:var(--ink);color:#fff}.btn-ink:hover{transform:translateY(-1.5px);box-shadow:var(--sh2)}
.btn-ghost{border-color:var(--line2);background:var(--surface)}.btn-ghost:hover{border-color:var(--eco);color:var(--green-d)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{filter:brightness(.94);transform:translateY(-1.5px)}
.btn-amber{background:var(--amber);color:#fff}
.btn-sm{padding:7px 13px;font-size:11px} .btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn:active{transform:translateY(0)!important}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:999px;text-transform:uppercase}
.badge svg{width:11px;height:11px}
.b-org{background:var(--green-t);color:var(--green)} .b-emp{background:var(--blue-t);color:var(--blue)} .b-admin{background:var(--ink);color:#fff}
.b-spon{background:var(--amber-t);color:var(--amber)}
.st-pending{background:var(--yellow-t);color:var(--yellow)} .st-approved,.st-verificado,.st-aprobada,.st-pagada{background:var(--green-t);color:var(--green)}
.st-rejected,.st-rechazado,.st-rechazada{background:var(--red-t);color:var(--red)} .st-changes{background:var(--blue-t);color:var(--blue)}
.st-en_revision{background:var(--blue-t);color:var(--blue)} .st-resuelto{background:var(--green-t);color:var(--green)}
.st-voting{background:var(--yellow-t);color:var(--yellow)} .st-scheduled{background:var(--blue-t);color:var(--blue)}
.st-completed{background:var(--green-t);color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line);padding:4px 11px;border-radius:999px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.pad{padding:20px}
.notice{border-left:4px solid var(--blue);background:var(--blue-t);padding:13px 15px;border-radius:0 8px 8px 0;font-size:13.5px}
.notice.warn{border-color:var(--amber);background:var(--amber-t)} .notice.danger{border-color:var(--red);background:var(--red-t)}
.notice.ok{border-color:var(--green);background:var(--green-t)}
/* Marca */
.brand{display:flex;align-items:center;gap:9px;transition:.15s}
.brand:hover{opacity:.85}
.brand>img,.brand>svg{flex:none;display:block;object-fit:contain}
.wm{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.045em;line-height:1;white-space:nowrap}
.wm .eco{color:var(--eco)} .wm .nova{color:var(--ink);margin-left:-1px}
#topbar{position:sticky;top:0;z-index:900;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(15,25,19,.03)}
#topbar .in{display:flex;align-items:center;gap:16px;height:66px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mut)}
.searchbox input{width:100%;padding:9px 14px 9px 36px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px}
.searchbox input:focus{outline:none;border-color:var(--eco)}
.tb-ico{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:.15s}
.tb-ico:hover{border-color:var(--line2);background:#fff}
.tb-ico svg{width:17px;height:17px}
.tb-ico .n{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative}
.avt{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;font-family:var(--disp);box-shadow:0 0 0 2px #fff,0 1px 3px rgba(15,25,19,.15);background-position:center;background-size:cover;background-repeat:no-repeat}.avt-photo{background-color:var(--green-d)}

.auth-left:before{background:radial-gradient(circle,rgba(255,255,255,.16),transparent 68%)}
.auth-left:after{border-color:rgba(255,255,255,.09)}
.auth-right{background:linear-gradient(180deg,#f7faf8 0%,#eef5f0 100%)}
.auth-card{border-radius:24px;box-shadow:0 18px 55px rgba(15,45,30,.09);padding:30px}
.auth-card input,.auth-card textarea,.auth-card select{border-radius:13px;background:#fbfdfb;border-color:#dfe8e1}
.auth-card .btn-green{border-radius:13px;min-height:44px}
#topbar{box-shadow:0 1px 0 rgba(15,25,19,.04),0 8px 24px rgba(15,25,19,.025)}
.top-search{background:#f3f6f3;border:1px solid #e2e9e3;border-radius:999px;padding:0 14px;min-height:40px}
.top-search input{background:transparent}
.tb-ico{border-radius:50%;width:40px;height:40px}
.app-main .card,.main .card{border-radius:18px}
.post{border-radius:20px;overflow:hidden}
.post .hd{padding:17px 18px 10px}
.post .ttl,.post .bd,.post .locs,.post .tags{padding-left:18px;padding-right:18px}
.post .imgs{margin:12px 18px 0;border-radius:16px;overflow:hidden}
.post .bar{padding:10px 12px 12px 14px}
.post .bar button{border-radius:999px}
.composer{border-radius:20px;padding:12px 14px}
.prof-head{border-radius:22px;box-shadow:0 8px 28px rgba(15,25,19,.045)}
.prof-cover{height:220px;background-position:center}
.prof-body{padding:0 24px 24px}
.prof-avt{border-radius:50%;width:104px;height:104px;margin-top:-52px}
.prof-stats{justify-content:space-between;padding:18px 24px 0}
.fchip{border-radius:999px;padding:9px 15px;background:#f2f6f2}
.fchip.on{background:#0d6b4d;color:#fff}
#bottomnav{backdrop-filter:blur(18px);background:rgba(255,255,255,.94)}
.bn{font-size:10px;padding:6px 9px}
.bn-pub{background:#0b6a4d;box-shadow:0 8px 20px rgba(11,106,77,.24)}
.menu-panel{max-height:min(88vh,780px);overflow-y:scroll;overscroll-behavior:contain;scrollbar-width:auto;scrollbar-color:#a7b8ab #edf2ed}
.menu-panel::-webkit-scrollbar{width:10px}
.menu-panel::-webkit-scrollbar-track{background:#edf2ed;border-radius:999px}
.menu-panel::-webkit-scrollbar-thumb{background:#9eb1a2;border-radius:999px;border:2px solid #edf2ed}
.menu-item{min-height:58px}
.share-choice{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left}
.share-choice:hover{background:#f5f8f5;border-color:#b7c9bb}
.share-choice .share-symbol{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#eef5ef;color:#0d6b4d;font-weight:800}
@media(max-width:860px){
 .auth-left{min-height:310px;padding:28px 22px 32px}
 .auth-left h1{font-size:28px}
 .auth-left p,.auth-left .auth-stats,.auth-left .mini-post{display:none}
 .auth-right{padding:18px 14px 34px}
 .auth-card{padding:22px;border-radius:22px}
 .prof-cover{height:180px}
 .prof-body{padding:0 16px 18px}
 .prof-info h2{font-size:24px}
 .prof-stats{padding:16px 14px 0;gap:12px}
 .post .hd{padding:15px 14px 8px}
 .post .ttl,.post .bd,.post .locs,.post .tags{padding-left:14px;padding-right:14px}
 .post .imgs{margin-left:14px;margin-right:14px}

#app{background:#edf5f0}
.wrap{max-width:1180px}
#topbar{background:rgba(255,255,255,.96);border-bottom:1px solid var(--ref-border);box-shadow:0 3px 18px rgba(31,67,45,.035)}
#topbar .in{height:70px}
.wm{font-size:23px;letter-spacing:-.055em}
.top-search{background:#f5f8f6;border-color:#e5ece7;min-height:42px}
.tb-ico{border-color:#e5ece7;background:#fff;width:42px;height:42px}
.app{gap:24px;padding-top:24px}
.rail a{border-radius:14px;padding:12px 15px;color:#718078}
.rail a.on{background:#e3f1e7;color:#176b4c;box-shadow:none}
.card{border-color:var(--ref-border);box-shadow:0 3px 18px rgba(31,67,45,.035);border-radius:20px}
.btn{border-radius:12px;letter-spacing:.015em;text-transform:none;font-weight:700}
.btn-green{background:#24965f}
.btn-green:hover{background:#1b7e4e}
.btn-ghost{border-color:#dfe8e1;background:#fff}
.composer{background:#fff;border-radius:20px;border:1px solid var(--ref-border);padding:14px 16px}
.composer .fake{background:#f4f7f5;border-color:#eef2ef;color:#839087;padding:12px 18px}
.post{background:#fff;border:1px solid var(--ref-border);border-radius:20px;box-shadow:0 3px 16px rgba(31,67,45,.03);overflow:hidden}
.post .hd{padding:18px 18px 10px}
.post .nm{font-size:15px}
.post .ttl{font-size:18px;line-height:1.35}
.post .bd{font-size:14px;color:#47574d;line-height:1.7}
.post .imgs{border-radius:16px}
.post .bar{border-top:1px solid #f0f3f0;margin-top:12px;padding:10px 12px 12px}
.post .bar button,.post .save-btn{color:#819087;border-radius:999px}
.post .bar button:hover,.post .save-btn:hover{background:#f0f7f2;color:#176b4c}
.prof-head{border-radius:22px;background:#fff;box-shadow:0 6px 24px rgba(31,67,45,.045);border-color:var(--ref-border)}
.prof-cover{height:240px;background-position:center;background-size:cover}
.prof-cover::after{background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.32))}
.prof-body{padding:0 28px 22px;gap:18px;align-items:flex-start}
.profile-head-main{align-items:flex-start;gap:18px;width:100%;padding-top:0}
.profile-avatar-wrap{margin-top:-62px}
.profile-avatar-wrap .prof-avt{width:124px;height:124px;border-radius:50%;border:6px solid #fff;box-shadow:0 5px 20px rgba(28,62,42,.16)}
.profile-avatar-status{right:4px;bottom:6px;width:25px;height:25px;background:#35a66c;border-width:4px}
.prof-info{padding-top:13px}
.prof-info h2{font-size:25px;color:#20352a;gap:7px}
.profile-handle{font-size:13px;color:#849188}
.profile-bio{font-size:14px;color:#607067;max-width:620px;line-height:1.65}
.profile-meta{gap:14px}
.profile-top-actions{padding-top:13px;gap:8px}
.prof-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 0;padding:17px 28px;border-top:1px solid #eef2ef;border-bottom:1px solid #eef2ef;text-align:center}
.prof-stats>span,.prof-stats>button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;font-size:12px;color:#8a978f}
.prof-stats b{font-size:18px;color:#263b2f}
.prof-stat-btn{font-size:12px}
.profile-tabs{border:0;background:#fff;border-bottom:1px solid #e9efeb;border-radius:0;padding:0;margin-top:18px;gap:0}
.profile-tabs .fchip{border-radius:0;background:transparent;color:#839188;padding:13px 15px;min-width:0;border-bottom:3px solid transparent;font-size:13px}
.profile-tabs .fchip.on{background:transparent;color:#176b4c;border-bottom-color:#24965f;font-weight:800}
.profile-tabs .fchip:hover{background:#f7faf8}
.profile-head-main+.profile-top-actions{margin-top:-6px}
.profile-edit-media{border-radius:18px}
.profile-edit-cover{background-position:center}
.menu-panel{border-radius:20px;box-shadow:0 22px 60px rgba(22,53,35,.18);background:#fff}
.menu-profile{background:linear-gradient(135deg,#f4faf5,#fff);padding:18px}
.menu-item{border-radius:12px;margin:2px 8px;width:calc(100% - 16px);padding:12px 13px}
.menu-item:hover{background:#f0f7f2}
#bottomnav{background:rgba(255,255,255,.97);border-top:1px solid #e4ece6;box-shadow:0 -6px 24px rgba(31,67,45,.045)}
#bottomnav .bn{color:#89978f}
#bottomnav .bn.on{color:#1c8053}
.bn-pub{background:#176b4c;box-shadow:0 7px 18px rgba(23,107,76,.2)}
.auth-grid{background:#f2f8f4;border-radius:24px;overflow:hidden;box-shadow:0 15px 45px rgba(22,65,42,.08)}
.auth-left{background-position:center;background-size:cover}
.auth-card{border-radius:26px;box-shadow:0 12px 35px rgba(22,65,42,.07);border:1px solid #e8f0ea}
.auth-card input,.auth-card textarea,.auth-card select{border-radius:12px;border-color:#e1ebe4;background:#fbfdfb}
.auth-card .btn-green{border-radius:12px;background:#24965f}
.page-head h1{color:#24392c}
.kicker{color:#278456}
@media(max-width:860px){
  body{background:#fff}
  #app{background:#f5f8f6}
  .app{padding:14px 12px 105px;gap:14px}
  .prof-cover{height:190px}
  .prof-body{padding:0 16px 18px;gap:10px}
  .profile-head-main{gap:12px;align-items:flex-start}
  .profile-avatar-wrap{margin-top:-52px}
  .profile-avatar-wrap .prof-avt{width:96px;height:96px;border-width:5px}
  .profile-avatar-status{width:22px;height:22px;right:0;bottom:3px;border-width:3px}
  .profile-avatar-status::after{inset:4px}
  .prof-info{padding-top:9px;min-width:0}
  .prof-info h2{font-size:21px}
  .profile-bio{font-size:13px;line-height:1.5}
  .profile-top-actions{width:100%;margin-left:0;padding-top:0}
  .profile-top-actions .btn{flex:1;min-width:0}
  .prof-stats{grid-template-columns:repeat(4,minmax(0,1fr));padding:14px 10px;gap:2px}
  .prof-stats b{font-size:16px}
  .prof-stats>span,.prof-stats>button{font-size:10.5px}
  .profile-tabs .fchip{font-size:12px;padding:12px 8px}
  .post{border-radius:17px}
  .post .hd{padding:14px 14px 8px}
  .post .ttl,.post .bd,.post .locs,.post .tags{padding-left:14px;padding-right:14px}
  .post .imgs{margin-left:14px;margin-right:14px;border-radius:14px}
  .composer{border-radius:17px}
  .menu-panel{max-height:calc(100vh - 60px);width:min(390px,94vw)}
}

  enabled(){return !!supabaseClient;},
  async signUp({email,password,name,kind='CIUDADANO'}){

const store={_m:{},
 get(k){try{return localStorage.getItem(k);}catch(e){return this._m[k]??null;}},
 set(k,v){try{localStorage.setItem(k,v);}catch(e){this._m[k]=v;}},
 del(k){try{localStorage.removeItem(k);}catch(e){}delete this._m[k];}};

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('es-MX')+' MXN';
const dShort=t=>new Date(t).toLocaleDateString('es-MX',{day:'numeric',month:'short'});
const dLong=t=>new Date(t).toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});
const timeAgo=t=>{const m=Math.round((Date.now()-t)/6e4);if(m<1)return'ahora';if(m<60)return`hace ${m} min`;const h=Math.round(m/60);if(h<24)return`hace ${h} h`;const d=Math.round(h/24);if(d<30)return`hace ${d} d`;return dShort(t);};
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h;};
const img=(s,w=800,h=560)=>`https://picsum.photos/seed/${s}/${w}/${h}`;
function avatar(u,sz=38,fs=14){if(u?.avatar)return`<span class="avt avt-photo" style="width:${sz}px;height:${sz}px;background-image:url('${u.avatar}')" aria-label="Foto de ${esc(u.name)}"></span>`;return`<span class="avt" style="width:${sz}px;height:${sz}px;font-size:${fs}px;background:hsl(${hue(u.id)} 42% 36%)">${initials(u.name)}</span>`;}

function save(){try{store.set(DBK,JSON.stringify(DB));}catch(e){toast('No se pudo guardar','err');}}
function load(){
  const r=store.get(DBK);
  let loaded=false;
  if(r){
    try{
      const parsed=JSON.parse(r);
      if(parsed&&Array.isArray(parsed.users)&&Array.isArray(parsed.posts)){
        DB=parsed;
        loaded=true;
      }
    }catch(e){
      console.warn('[EcoNova] No se pudo leer la base local guardada.',e);
    }
  }
  if(!loaded) DB=seed();
  DB.users=Array.isArray(DB.users)?DB.users:[];
  DB.posts=Array.isArray(DB.posts)?DB.posts:[];
  const admin=DB.users.find(u=>u.id==='u1');
  if(admin){admin.email='admin@econova.mx';admin.pass='1234';admin.okMail=true;admin.role='DEV';admin.kind='ADMIN';}
  const citizen=DB.users.find(u=>u.id==='u2');
  if(citizen){citizen.email='ciudadano@econova.mx';citizen.pass='1234';citizen.okMail=true;citizen.kind='CIUDADANO';}
  if(!DB.users.some(u=>u.id==='umod')) DB.users.push({id:'umod',name:'Moderador EcoNova',email:'moderador@econova.mx',pass:'1234',kind:'CIUDADANO',role:'MOD',bio:'Moderación de la comunidad EcoNova.',loc:'Ciudad de México',verified:false,suspended:false,okMail:true,showFollowers:true,showFollowing:true,showPosts:true,privateProfile:false,allowComments:true,notifyLikes:true,notifyComments:true,notifyFollows:true,blockedUsers:[],suspensionUntil:null,banPermanent:false,banReason:'',website:'',avatar:'',at:Date.now()});
  cleanupDemoContent();
  save();
}
function cleanupDemoContent(){
  // Elimina únicamente las cuentas de demostración originales.
  // Los usuarios registrados posteriormente deben conservarse.
  const demoUserIds=new Set(['u3','u4','u5','u6','u7','u8']);
  DB.users=(DB.users||[]).filter(u=>!demoUserIds.has(u.id));
  const validIds=new Set(DB.users.map(u=>u.id));
  DB.posts=(DB.posts||[]).filter(p=>validIds.has(p.userId)).map(p=>{
    p.likes=(p.likes||[]).filter(id=>validIds.has(id));
    p.savedBy=(p.savedBy||[]).filter(id=>validIds.has(id));
    p.comments=(p.comments||[]).filter(c=>validIds.has(c.userId));
    return p;
  });
  if(Array.isArray(DB.campaigns))DB.campaigns=DB.campaigns.filter(c=>!c.orgId||validIds.has(c.orgId));
  if(Array.isArray(DB.orgRequests))DB.orgRequests=DB.orgRequests.filter(r=>validIds.has(r.userId));
  if(Array.isArray(DB.notifications))DB.notifications=DB.notifications.filter(n=>validIds.has(n.userId)||validIds.has(n.to));
  if(Array.isArray(DB.follows))DB.follows=DB.follows.filter(f=>validIds.has(f.from)||validIds.has(f.to)||validIds.has(f.userId));
}

const userById=id=>DB.users.find(u=>u.id===id)||{id:'?',name:'Usuario'};
const catById=id=>DB.cats.find(c=>c.id===id)||{name:'Sin categoría',grp:'—'};
const postById=id=>DB.posts.find(p=>p.id===id);
const campById=id=>DB.campaigns.find(c=>c.id===id);
const supById=id=>DB.supports.find(s=>s.id===id);
function fund(){
 const inn=DB.donations.filter(d=>d.target==='FONDO').reduce((a,d)=>a+d.amount,0);
 const paid=DB.supports.filter(s=>s.status==='PAGADA').reduce((a,s)=>a+s.amount,0);
 const com=DB.supports.filter(s=>s.status==='APROBADA').reduce((a,s)=>a+s.amount,0);
 return{inn,paid,com,avail:inn-paid-com};
}
function impact(){
 const done=DB.campaigns.filter(c=>c.status==='COMPLETED');
 return{trees:done.reduce((a,c)=>a+(c.result?.trees||0),0),kg:done.reduce((a,c)=>a+(c.result?.kg||0),0),journeys:done.length,volunteers:done.reduce((a,c)=>a+c.participants.length,0)+1120};
}

/* ---------- API ---------- */
const API={
 notify(uid_,title,body=''){DB.notifs.unshift({id:uid(),userId:uid_,title,body,at:Date.now(),read:false});},
 audit(action){DB.audit.unshift({id:uid(),admin:sess()?.id||'u1',action,at:Date.now()});},
 signup(name,email,pass,kind){
  if(DB.users.some(u=>u.email===email.toLowerCase()))throw'Ya existe una cuenta con ese correo.';
  name=String(name||'').trim();email=String(email||'').trim().toLowerCase();pass=String(pass||'');kind=kind||'CIUDADANO';if(name.length<2)throw'Escribe tu nombre completo.';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw'Escribe un correo electrónico válido.';if(pass.length<4)throw'La contraseña necesita al menos 4 caracteres.';
  const u={id:uid(),name:name.trim(),email:email.toLowerCase(),pass,kind,role:'USER',bio:'',loc:'',verified:false,suspended:false,okMail:true,showFollowers:true,showFollowing:true,showPosts:true,privateProfile:false,allowComments:true,notifyLikes:true,notifyComments:true,notifyFollows:true,blockedUsers:[],suspensionUntil:null,banPermanent:false,banReason:'',bio:'',loc:'',website:'',avatar:'',at:Date.now()};
  DB.users.push(u);save();store.set('econova_pending',u.id);return u;},
 verify(code){
  if(code.trim()!=='123456')throw'Código incorrecto. Revisa tu correo (demo: 123456).';
  const u=userById(store.get('econova_pending'));
  u.okMail=true;store.del('econova_pending');store.set('econova_session',u.id);save();return u;},
 login(email,pass){
  const alias=String(email||'').trim().toLowerCase();
  const aliases={'admin':'admin@econova.mx','admin@econova.mx':'admin@econova.mx','ciudadano':'ciudadano@econova.mx','ciudadano@econova.mx':'ciudadano@econova.mx','moderador':'moderador@econova.mx','moderador@econova.mx':'moderador@econova.mx'};
  const loginEmail=aliases[alias]||alias;
  const u=DB.users.find(x=>x.email.toLowerCase()===loginEmail&&x.pass===pass);
  if(!u)throw'Correo o contraseña incorrectos.';
  if(u.banPermanent)throw`Tu cuenta fue bloqueada permanentemente por el equipo de moderación.${u.banReason?' Motivo: '+u.banReason:''}`;
  if(u.suspensionUntil&&Date.now()<u.suspensionUntil)throw`Tu cuenta está suspendida temporalmente hasta ${new Date(u.suspensionUntil).toLocaleString('es-MX')}.${u.banReason?' Motivo: '+u.banReason:''}`;
  if(u.suspensionUntil&&Date.now()>=u.suspensionUntil){u.suspensionUntil=null;u.suspended=false;save();}
  if(u.suspended)throw`Tu cuenta está suspendida por el equipo de moderación.${u.banReason?' Motivo: '+u.banReason:''}`;
  if(!u.okMail)throw'Debes verificar tu correo antes de entrar.';
  store.set('econova_session',u.id);return u;},
 logout(){store.del('econova_session');},
 logActivity(type,data={}){const u=sess();if(!u)return;DB.activity=Array.isArray(DB.activity)?DB.activity:[];DB.activity.unshift({id:uid(),userId:u.id,type,...data,at:Date.now()});DB.activity=DB.activity.filter(a=>a.userId!==u.id||a.at>=Date.now()-90*864e5).slice(0,1200);save();},
 createPost(d){
  const u=sess();if(!u)throw'Inicia sesión para publicar.';
  const unrestricted=u.role==='DEV'||u.role==='ADMIN'||u.role==='MOD'||u.id==='u1';
  const today=new Date().setHours(0,0,0,0);
  if(!unrestricted&&DB.posts.filter(p=>p.userId===u.id&&p.at>=today).length>=8)throw'Límite diario de publicaciones alcanzado (8). Así protegemos la comunidad del spam.';
  const tags=(d.body.match(/#[\wáéíóúñÁÉÍÓÚÑ]+/g)||[]).map(t=>t.slice(1));
  DB.posts.unshift({id:uid(),userId:u.id,title:d.title,body:d.body,cat:+d.cat,loc:d.loc,imgs:d.imgs,tags,status:unrestricted?'APPROVED':'PENDING',sponsored:false,likes:[],comments:[],shares:0,savedBy:[],at:Date.now()});save();},
 moderate(id,dec,note){
  const p=postById(id);p.status=dec;p.modNote=note||'';
  if(dec==='APPROVED')this.notify(p.userId,'Tu publicación fue aprobada',`"${p.title}" ya es visible para la comunidad.`);
  if(dec==='CHANGES')this.notify(p.userId,'Tu publicación requiere cambios',note||'Revisa la moderación.');
  if(dec==='REJECTED')this.notify(p.userId,'Tu publicación fue rechazada',note||'');
  this.audit(`${PST[dec]||dec} la publicación "${p.title}"`);save();},
 changeCat(id,cat){const p=postById(id);p.cat=+cat;this.audit(`Cambió la categoría de "${p.title}" a ${catById(+cat).name}`);save();},
 removePost(id){const me=sess();const p=postById(id);if(!p)throw'Publicación no encontrada.';if(!me||!(me.id===p.userId||isAdmin()))throw'No tienes permiso para eliminar esta publicación.';p.status='REMOVED';p.removedBy=me.id;this.audit(`Eliminó la publicación \"${p.title}\"`);save();},
 like(id){const u=sess();if(!u)throw'Inicia sesión.';const p=postById(id);if(!p)throw'Publicación no encontrada.';if(['REJECTED','REMOVED'].includes(p.status))throw'Esta publicación no admite interacciones.';const owner=userById(p.userId);if((u.blockedUsers||[]).includes(owner.id)||(owner.blockedUsers||[]).includes(u.id))throw'No puedes interactuar con esta cuenta.';const i=p.likes.indexOf(u.id);if(i>=0)p.likes.splice(i,1);else{p.likes.push(u.id);this.logActivity('like',{postId:id,title:p.title,userId:owner.id});}save();},
 comment(id,body){const u=sess();if(!u)throw'Inicia sesión para comentar.';const p=postById(id);if(!p)throw'Publicación no encontrada.';if(['REJECTED','REMOVED'].includes(p.status))throw'Esta publicación no admite comentarios.';const owner=userById(p.userId);if(owner.allowComments===false&&owner.id!==u.id)throw'El autor desactivó los comentarios en esta publicación.';p.comments=Array.isArray(p.comments)?p.comments:[];p.comments.push({id:uid(),userId:u.id,body,parentId:null,likes:[],at:Date.now()});if(p.userId!==u.id&&userById(p.userId).notifyComments!==false)this.notify(p.userId,'Nuevo comentario',`${u.name} comentó en "${p.title}".`);save();},
 likeComment(postId,commentId){const u=sess();if(!u)throw'Inicia sesión.';const p=postById(postId);const c=(p?.comments||[]).find(x=>x.id===commentId);if(!c)throw'Comentario no encontrado.';c.likes=Array.isArray(c.likes)?c.likes:[];const i=c.likes.indexOf(u.id);if(i>=0)c.likes.splice(i,1);else c.likes.push(u.id);save();},
 replyComment(postId,parentId,body){const u=sess();if(!u)throw'Inicia sesión para responder.';const p=postById(postId);if(!p)throw'Publicación no encontrada.';const parent=(p.comments||[]).find(x=>x.id===parentId);if(!parent)throw'Comentario no encontrado.';p.comments=Array.isArray(p.comments)?p.comments:[];p.comments.push({id:uid(),userId:u.id,body,parentId,likes:[],at:Date.now()});if(p.userId!==u.id&&userById(p.userId).notifyComments!==false)this.notify(p.userId,'Nueva respuesta',`${u.name} respondió en "${p.title}".`);save();},
 share(id){
  const u=sess();if(!u)throw'Inicia sesión.';
  const p=postById(id);if(!p)throw'Publicación no encontrada.';if(['REJECTED','REMOVED'].includes(p.status))throw'Esta publicación no se puede compartir.';
  const original=p.sharedFrom?postById(p.sharedFrom)||p:p;
  const already=DB.posts.some(x=>x.userId===u.id&&x.sharedFrom===original.id&&x.status==='APPROVED');
  if(!already){
    DB.posts.unshift({id:uid(),userId:u.id,title:original.title,body:original.body,cat:original.cat,loc:original.loc,imgs:[...(original.imgs||[])],tags:[...(original.tags||[])],status:'APPROVED',sponsored:false,likes:[],comments:[],shares:0,savedBy:[],sharedFrom:original.id,sharedAt:Date.now(),at:Date.now()});
  }
  original.shares=(original.shares||0)+1;
  this.logActivity('share',{postId:original.id,title:original.title,userId:original.userId});save();return !already;
},
 toggleSave(id){const u=sess();if(!u)throw'Inicia sesión.';const p=postById(id);if(!p)throw'Publicación no encontrada.';if(['REJECTED','REMOVED'].includes(p.status))throw'Esta publicación no se puede guardar.';const i=p.savedBy.indexOf(u.id);if(i>=0)p.savedBy.splice(i,1);else{p.savedBy.push(u.id);this.logActivity('save',{postId:id,title:p.title,userId:p.userId});}save();return i<0;},
 toggleFollow(target){const u=sess();if(!u)throw'Inicia sesión.';const targetU=userById(target);if((u.blockedUsers||[]).includes(target)||((targetU.blockedUsers||[]).includes(u.id)))throw'No puedes seguir a una cuenta bloqueada.';const i=DB.follows.findIndex(f=>f.f===u.id&&f.t===target);if(i>=0)DB.follows.splice(i,1);else{DB.follows.push({f:u.id,t:target});this.logActivity('follow',{targetId:target,title:targetU.name});if(userById(target).notifyFollows!==false)this.notify(target,'Nuevo seguidor',`${u.name} empezó a seguirte.`);}save();return i<0;},
 flag(postId,reason){const u=sess();if(!u)throw'Inicia sesión.';DB.flags.push({id:uid(),postId,userId:u.id,reason,status:'ABIERTA',at:Date.now()});save();},
 resolveFlag(fid,action){const f=DB.flags.find(x=>x.id===fid);f.status='RESUELTA';if(action==='REMOVE')this.removePost(f.postId);else this.audit('Desechó una denuncia de contenido');save();},
 createReport(d){const u=sess();if(!u)throw'Inicia sesión para reportar.';
  DB.reports.unshift({id:uid(),userId:u.id,title:d.title,desc:d.desc,cat:+d.cat,lat:d.lat,lng:d.lng,date:d.date,imgs:d.imgs,status:'PENDIENTE',adminNote:'',at:Date.now()});
  this.notify('u1','Nuevo reporte ambiental',`"${d.title}" espera revisión.`);save();},
 setReport(id,st,note){const r=DB.reports.find(x=>x.id===id);r.status=st;r.adminNote=note||r.adminNote;
  this.notify(r.userId,`Tu reporte está ${RST[st].toLowerCase()}`,note||r.title);this.audit(`Marcó el reporte "${r.title}" como ${RST[st]}`);save();},
 createCampaign(d){const u=sess();if(!u)throw'Inicia sesión.';
  const opts=d.opts.filter(o=>o.dt).map(o=>({id:uid(),label:o.label,dt:new Date(o.dt+'T'+(o.time||'10:00')).getTime(),votes:[]}));
  if(!opts.length)throw'Agrega al menos una opción de fecha y hora.';
  const c={id:uid(),orgId:u.id,name:d.name,desc:d.desc,kind:d.kind,cat:+d.cat,place:d.place,lat:d.lat??19.435,lng:d.lng??-99.135,max:+d.max||20,status:'VOTING',img:d.img||img('campana-'+uid(),600,450),selected:null,participants:[],result:null,opts,at:Date.now()};
  DB.campaigns.unshift(c);this.notify('u1','Nueva campaña creada',`"${c.name}" abrió votación de fechas.`);save();return c;},
 vote(cid,oid){const u=sess();if(!u)throw'Inicia sesión para votar.';const c=campById(cid);
  c.opts.forEach(o=>o.votes=o.votes.filter(v=>v!==u.id));
  c.opts.find(x=>x.id===oid).votes.push(u.id);save();},
 closeVoting(cid){const c=campById(cid);const best=c.opts.slice().sort((a,b)=>b.votes.length-a.votes.length)[0];
  if(!best)throw'Sin votos todavía.';c.selected=best.id;c.status='SCHEDULED';
  const when=`${dLong(best.dt)} · ${new Date(best.dt).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}`;
  [...new Set(c.opts.flatMap(o=>o.votes))].forEach(v=>this.notify(v,'Fecha confirmada',`La comunidad eligió: ${when} para "${c.name}".`));
  this.audit(`Confirmó la fecha de la campaña "${c.name}"`);save();},
 join(cid){const u=sess();if(!u)throw'Inicia sesión.';const c=campById(cid);
  if(c.status!=='SCHEDULED')throw'La fecha aún no está confirmada.';

  if(c.participants.length>=c.max)throw'La campaña está llena.';

 donate(target,tlabel,amount,name){
  if(!amount||amount<20)throw'El monto mínimo de donación es $20.';
  DB.donations.push({id:uid(),userId:sess()?.id||null,name:name||(sess()?.name)||'Anónimo',target,tlabel,amount:+amount,at:Date.now()});
  this.notify('u1','Nueva donación',`${name||'Anónimo'} aportó ${money(amount)} a ${tlabel}.`);save();},
 requestSupport(d){
  const u=sess();if(!u)throw'Inicia sesión para solicitar apoyo.';
  if(DB.supports.some(s=>s.userId===u.id&&s.status==='PENDIENTE'))throw'Ya tienes una solicitud en revisión. Espera la respuesta antes de enviar otra.';
  if(!d.title||d.title.trim().length<8)throw'Describe brevemente para qué necesitas el apoyo.';
  if(!d.amount||d.amount<50||d.amount>5000)throw'El monto debe estar entre $50 y $5,000 MXN.';
  if(!d.just||d.just.trim().length<30)throw'La justificación necesita más detalle (mínimo 30 caracteres).';
  const f=fund();
  if(d.amount>f.avail+f.com)throw'El fondo no dispone de ese monto por ahora. Puedes solicitar menos o esperar nuevas donaciones.';
  DB.supports.unshift({id:uid(),userId:u.id,title:d.title.trim(),type:d.type,amount:+d.amount,just:d.just.trim(),status:'PENDIENTE',note:'',at:Date.now(),rev:null});
  this.notify('u1','Nueva solicitud de apoyo',`${u.name} solicita ${money(d.amount)} para "${d.title}".`);save();},
 reviewSupport(id,ok,note){
  const s=supById(id);
  s.status=ok?'APROBADA':'RECHAZADA';s.note=note||'';s.rev=Date.now();
  this.notify(s.userId,ok?'Tu solicitud de apoyo fue aprobada':'Tu solicitud de apoyo fue rechazada',ok?`Monto: ${money(s.amount)}. Te contactaremos para coordinar la entrega.`:(note||''));
  this.audit(`${ok?'Aprobó':'Rechazó'} la solicitud de apoyo "${s.title}" (${money(s.amount)})`);save();},
 markPaid(id){const s=supById(id);s.status='PAGADA';s.rev=Date.now();

  this.audit(`Marcó como entregado el apoyo "${s.title}" (${money(s.amount)})`);save();},
 addExpense(concept,amount){DB.expenses.unshift({id:uid(),concept,amount:+amount,public:false,at:Date.now()});this.audit('Registró un gasto de transparencia');save();},
 publishExpense(id,publicState=true){if(!isAdmin())throw'Solo administración puede cambiar la visibilidad.';const e=DB.expenses.find(x=>x.id===id);if(!e)throw'Gasto no encontrado.';e.public=!!publicState;this.audit(`${publicState?'Hizo público':'Ocultó'} un gasto en Transparencia`);save();},
 requestPromo(postId){const u=sess();if(!['ORG','EMPRESA'].includes(u.kind))throw'Solo organizaciones y empresas pueden impulsar publicaciones.';
  if(DB.promos.some(p=>p.postId===postId&&p.status==='PENDING'))throw'Ya tienes una solicitud en revisión.';
  DB.promos.push({id:uid(),postId,orgId:u.id,status:'PENDING',at:Date.now()});this.notify('u1','Solicitud de impulso',`${u.name} quiere impulsar una publicación.`);save();},
 reviewPromo(id,ok){const pr=DB.promos.find(p=>p.id===id);pr.status=ok?'APPROVED':'REJECTED';
  if(ok)postById(pr.postId).sponsored=true;
  this.notify(pr.orgId,ok?'Publicidad aprobada':'Publicidad rechazada',ok?'Tu publicación ahora aparece como patrocinada.':'La solicitud no cumple los criterios.');
  this.audit(`${ok?'Aprobó':'Rechazó'} una solicitud de impulso`);save();},
 addCategory(name,grp){if(DB.cats.some(c=>c.name.toLowerCase()===name.toLowerCase()))throw'Esa categoría ya existe.';DB.cats.push({id:Math.max(...DB.cats.map(c=>c.id))+1,name,grp,active:true});this.audit(`Creó la categoría "${name}"`);save();},
 toggleCat(id){const c=catById(id);c.active=!c.active;this.audit(`${c.active?'Activó':'Desactivó'} la categoría "${c.name}"`);save();},
 delCat(id){if(DB.posts.some(p=>p.cat===id)||DB.reports.some(r=>r.cat===id)||DB.campaigns.some(c=>c.cat===id))throw'No se puede eliminar: tiene contenido asociado.';DB.cats=DB.cats.filter(c=>c.id!==id);this.audit('Eliminó una categoría');save();},
 suspend(id,val){const u=userById(id);u.suspended=val;this.audit(`${val?'Suspendió':'Reactivó'} a ${u.name}`);save();},
 verifyOrg(id){const u=userById(id);u.verified=true;this.notify(u.id,'Cuenta verificada','Tu perfil ahora muestra la insignia azul de verificación.');this.audit(`Verificó a ${u.name}`);save();},
 setVerified(id,val){if(!isAdmin())throw'Acceso restringido.';const u=userById(id);if(!u||u.id==='?')throw'Usuario no encontrado.';u.verified=!!val;this.audit(`${val?'Verificó':'Quitó la verificación a'} ${u.name}`);if(val)this.notify(u.id,'Cuenta verificada','Tu perfil ahora muestra la insignia azul de verificación.');save();},
 requestCommunity(type){const u=sess();if(!u||!['ORG','EMPRESA'].includes(u.kind))throw'Solo organizaciones y empresas pueden solicitar reconocimiento.';if(DB.orgRequests.some(r=>r.userId===u.id&&r.type===type&&r.status==='PENDING'))throw'Ya tienes una solicitud pendiente.';DB.orgRequests.push({id:uid(),userId:u.id,type,status:'PENDING',at:Date.now()});this.notify('u1','Nueva solicitud de reconocimiento',`${u.name} solicitó ${type==='ally'?'ser organización aliada':'reconocimiento como donador'}.`);save();},
reviewCommunityRequest(id,ok){if(!isAdmin())throw'Acceso restringido.';const r=DB.orgRequests.find(x=>x.id===id);if(!r)throw'Solicitud no encontrada.';r.status=ok?'APPROVED':'REJECTED';if(ok)this.setCommunityStatus(r.userId,r.type,true);else save();this.notify(r.userId,ok?'Solicitud aceptada':'Solicitud rechazada',ok?'Tu solicitud de reconocimiento fue aceptada.':'Tu solicitud de reconocimiento fue rechazada.');save();},
setCommunityStatus(id,type,val){if(!isAdmin())throw'Acceso restringido.';const u=userById(id);if(!u||u.id==='?')throw'Usuario no encontrado.';if(type==='ally'&&!['ORG','EMPRESA'].includes(u.kind))throw'Solo organizaciones y empresas pueden tener emblema de aliado.';if(type==='ally')u.allyAccepted=!!val;if(type==='donor')u.donorAccepted=!!val;u.emblems=Array.isArray(u.emblems)?u.emblems:[];const code=type==='ally'?'ALLY':'DONOR';u.emblems=u.emblems.filter(x=>x!==code);if(val)u.emblems.push(code);this.audit(`${val?'Aceptó':'Quitó'} el emblema ${type==='ally'?'de aliado':'de donador'} a ${u.name}`);save();},
 setEmblem(id,code){if(!isAdmin())throw'Acceso restringido.';const u=userById(id);if(!u||u.id==='?')throw'Usuario no encontrado.';if(code==='ECONOVA'&&!isDeveloper())throw'Solo el desarrollador puede asignar el emblema EcoNova.';if(code==='ECONOVA'&&u.id!=='u1')throw'El emblema EcoNova es único y pertenece al perfil oficial de EcoNova.';if(code==='ALLY'&&!['ORG','EMPRESA'].includes(u.kind))throw'El emblema Empresa aliada solo puede darse a empresas u organizaciones.';if(code==='MOD'&&u.role!=='MOD')u.role='MOD';u.emblems=Array.isArray(u.emblems)?u.emblems:[];if(code==='ECONOVA'){DB.users.forEach(x=>{x.emblems=(Array.isArray(x.emblems)?x.emblems:[]).filter(e=>e!=='ECONOVA');});u.emblems=['ECONOVA'];u.name='EcoNova';u.role='DEV';u.kind='ADMIN';u.verified=true;}else if(!u.emblems.includes(code)){u.emblems.push(code);}u.allyAccepted=u.emblems.includes('ALLY');u.donorAccepted=u.emblems.includes('DONOR');this.audit(`Asignó el emblema ${code} a ${u.name}`);save();},
 removeEmblem(id,code){if(!isAdmin())throw'Acceso restringido.';const u=userById(id);if(!u||u.id==='?')throw'Usuario no encontrado.';if(code==='ECONOVA')throw'El emblema EcoNova no puede quitarse del perfil oficial.';u.emblems=(Array.isArray(u.emblems)?u.emblems:[]).filter(e=>e!==code);u.allyAccepted=u.emblems.includes('ALLY');u.donorAccepted=u.emblems.includes('DONOR');if(code==='MOD'&&u.role==='MOD')u.role='USER';this.audit(`Quitó el emblema ${code} a ${u.name}`);save();},
 clearActivity(){const u=sess();if(!u)throw'Inicia sesión.';DB.activity=DB.activity.filter(a=>a.userId!==u.id||a.type==='like'||a.type==='save');save();},
 updateProfile(d){const u=sess();if(!u)throw'Inicia sesión.';const name=String(d.name||'').trim();if(name.length<2)throw'El nombre debe tener al menos 2 caracteres.';u.name=name.slice(0,80);u.bio=String(d.bio||'').trim().slice(0,300);u.loc=String(d.loc||'').trim().slice(0,100);u.website=String(d.website||'').trim().slice(0,180);u.avatar=String(d.avatar||'');if(d.cover!==undefined)u.cover=String(d.cover||'');save();},

function modal(html){$('#modal').innerHTML=`<div class="modal-card">${html}</div>`;$('#modal').classList.add('open');}
function closeModal(){$('#modal').classList.remove('open');$('#modal').innerHTML='';}
document.addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
let MAPS=[];function killMaps(){MAPS.forEach(m=>{try{m.remove();}catch(e){}});MAPS=[];}
const mk=cls=>L.divIcon({className:'',html:`<span class="mk ${cls}"></span>`,iconSize:[16,16],iconAnchor:[8,8]});
function catOptions(sel){return GRUPOS.map(g=>{const cs=DB.cats.filter(c=>c.grp===g&&c.active);if(!cs.length)return'';return`<optgroup label="${g}">${cs.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`;}).join('');}

  <div class="bar">

function initMap(){

 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);
 if(mapLayers.reports)DB.reports.forEach(r=>{
  if(mapCat&&r.cat!==+mapCat)return;
  const cls=r.status==='PENDIENTE'?'mk-rep':(r.status==='VERIFICADO'||r.status==='RESUELTO')?'mk-rep-ok':'mk-rep-v';
  L.marker([r.lat,r.lng],{icon:mk(cls)}).addTo(m).bindPopup(`<div class="pop">${r.imgs.length?`<img src="${r.imgs[0]}">`:''}<h4>${esc(r.title)}</h4><div class="row"><span>${esc(catById(r.cat).name)}</span><b>${RST[r.status]}</b></div><a class="btn btn-ink" href="#/reportes">Ver reportes</a></div>`);});

 if(mapLayers.orgs)DB.users.filter(u=>['ORG','EMPRESA'].includes(u.kind)).forEach((o,i)=>{

 MAPS.push(m);
}

function viewComments(id){

 const renderComment=(c,depth=0)=>{const cu=userById(c.userId);const likes=Array.isArray(c.likes)?c.likes:[];const liked=me&&likes.includes(me.id);const replies=comments.filter(r=>r.parentId===c.id);return `<div class="comment-row" style="margin-left:${Math.min(depth,3)*18}px">${avatar(cu,34,11)}<div class="comment-body"><div><b><a href="#/perfil/${cu.id}">${esc(cu.name)}</a></b>${cu.verified?verifyBadge():''}<span class="xs mut"> · ${timeAgo(c.at)}</span></div><div class="mt1">${esc(c.body)}</div><div class="comment-actions"><button class="${liked?'act':''}" data-action="comment-like" data-p="${p.id}" data-c="${c.id}">${ic('heart')} ${likes.length}</button><button data-action="comment-reply" data-p="${p.id}" data-c="${c.id}">${ic('msg')} Responder</button></div>${replies.map(r=>renderComment(r,depth+1)).join('')}</div></div>`;};

}

function viewActivity(filter='all'){

 <div class="kpi-grid k4 mt2"><div class="kpi"><div class="n">${searches.length}</div><div class="l">Búsquedas</div></div><div class="kpi"><div class="n">${likes.length}</div><div class="l">Me gusta</div></div><div class="kpi"><div class="n">${saves.length}</div><div class="l">Guardados</div></div><div class="kpi"><div class="n">${follows.length+shares.length}</div><div class="l">Interacciones</div></div></div>

/* ---------- router ---------- */
let lastRenderHash='';
function render(){
 const h=location.hash||'#/';
 const sameRoute=lastRenderHash===h;
 const preservedScroll=window.scrollY||0;
 killMaps();dropOpen=null;
 const [path,arg]=h.replace('#/','').split('/');
 const u=sess();
 const authPages=['entrar','registro','verificar'];
 document.body.classList.toggle('auth-route',authPages.includes(path));
 let view='',full=false;
 if(!u&&!authPages.includes(path)){location.hash='#/entrar';return;}
 switch(path){
  case '':view=viewFeed();break;
  case 'entrar':case 'registro':authMode=path==='registro'?'registro':'login';view=viewAuth();full=true;break;
  case 'verificar':view=viewVerify();full=true;break;
  case 'explorar':view=viewExplore();break;
  case 'mapa':view=viewMap();break;
  case 'reportes':view=viewReports();break;
  case 'purificacion':view=viewPurification();break;
  case 'estado-publicaciones':view=viewPostStatus();break;
  case 'reportar':view=viewNewReport();break;
  case 'campanas':view=viewCampaigns();break;
  case 'crear-campana':view=viewNewCampaign();break;
  case 'campana':view=viewCampaign(arg);break;
  case 'noticias':view=viewNews();break;
  case 'aprender':view=viewLearn();break;
  case 'donar':view=viewDonate();break;
  case 'transparencia':view=viewTransparency();break;
  case 'organizaciones':view=viewOrgs();break;
  case 'perfil':view=viewProfile(arg);break;
  case 'publicacion':view=viewSinglePost(arg);break;
  case 'comentarios':view=viewComments(arg);break;
  case 'guardados':view=viewSaved();break;
  case 'notificaciones':view=viewNotifs();break;
  case 'actividad':view=viewActivity(arg||'all');break;
  case 'configuracion':view=viewSettings();break;
  case 'admin':view=viewAdmin();break;
  default:view='<div class="card pad mt3">Página no encontrada. <a class="link" href="#/">Ir al inicio</a></div>';
 }
 if(full)$('#app').innerHTML=view;
 else $('#app').innerHTML=`<div class="app">${u?chromeRail():'<span></span>'}<div style="min-width:0">${view}</div>${u?sideRail():'<span></span>'}</div>`;
 chromeTop();
 window.scrollTo(0,sameRoute?preservedScroll:0);
 lastRenderHash=h;
 requestAnimationFrame(()=>{
  if(sameRoute)window.scrollTo(0,preservedScroll);
  if(path==='mapa')initMap();
  if(path==='reportar')initPickMap();
  counters();
 });
}
function counters(){$$('[data-count]').forEach(el=>{const t=+el.dataset.count;let c=0;const s=Math.max(1,Math.round(t/36));const iv=setInterval(()=>{c+=s;if(c>=t){c=t;clearInterval(iv);}el.textContent=c.toLocaleString('es-MX');},28);});}
function compress(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=()=>rej();rd.onload=()=>{const im=new Image();im.onerror=()=>rej();im.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,1400/im.width);c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));const ctx=c.getContext('2d');ctx.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82));};im.src=rd.result;};rd.readAsDataURL(file);});}

let postImgs=[];
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');
 const kd=e.target.closest('[data-kind]');
 if(kd){$$('[data-kind]').forEach(b=>b.classList.remove('on'));kd.classList.add('on');signupKind=kd.dataset.kind;return;}
 const amt=e.target.closest('[data-amt]');
 if(amt&&$('#d-amt')){$$('[data-amt]').forEach(b=>b.classList.remove('on'));amt.classList.add('on');
  if(amt.dataset.amt){$('#d-amt').value=amt.dataset.amt;}else{$('#d-amt').value='';$('#d-amt').focus();}return;}
 if(!el){if(dropOpen){dropOpen=null;chromeTop();}return;}
 const a=el.dataset.action;
 if(a==='quick-search'){GQ=el.dataset.q||'';location.hash='#/explorar';render();return;}
 const run=fn=>{try{fn();render();}catch(m){if(m)toast(m,'err');}};

document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target;const d=f.dataset.form;

  if(d==='login'){Cloud.login($('#l-e').value,$('#l-p').value).then(()=>{toast('Bienvenido a EcoNova.','ok');location.hash='#/';render();}).catch(m=>toast(String(m),'err'));}

  if(d==='verify'){API.verify($('#v-code').value);toast('Correo verificado. ¡Bienvenido!','ok');location.hash='#/';render();}

  if(d==='cmt'){API.comment(f.dataset.p,f.querySelector('input').value.trim());toast('Comentario publicado.','ok');location.hash='#/comentarios/'+f.dataset.p;render();}
  if(d==='comment-reply'){API.replyComment(f.dataset.p,f.dataset.c,$('#reply-body').value.trim());closeModal();toast('Respuesta publicada.','ok');location.hash='#/comentarios/'+f.dataset.p;render();}
  if(d==='edit-profile'){API.updateProfile({name:$('#ep-name').value,bio:$('#ep-bio').value,loc:$('#ep-loc').value,website:$('#ep-web').value,avatar:profileEditImg,cover:profileEditCover});closeModal();toast('Perfil actualizado.','ok');render();}

  if(d==='modnote'){API.moderate(f.dataset.p,f.dataset.d,$('#mn-t')?$('#mn-t').value:$('#mn-r').value);closeModal();toast('Respuesta enviada al autor.','ok');render();}
  if(d==='supok'){API.reviewSupport(f.dataset.s,true,$('#so-n').value.trim());closeModal();toast('Apoyo aprobado. El monto quedó comprometido del fondo.','ok');render();}
  if(d==='supno'){API.reviewSupport(f.dataset.s,false,$('#sn-n').value.trim());closeModal();toast('Solicitud rechazada.');render();}

   const c=API.createCampaign({name:$('#c-name').value,desc:$('#c-desc').value,kind:$('#c-kind').value,cat:$('#c-cat').value,place:$('#c-place').value,max:$('#c-max').value,img:campImgs[0],opts});
   toast('Campaña creada. La votación de fechas está abierta.','ok');location.hash='#/campana/'+c.id;render();

  if(d==='newcat'){API.addCategory($('#nc-name').value,$('#nc-grp').value);toast('Categoría agregada.','ok');render();}

 }catch(m){toast(m,'err');}

  [...inp.files].forEach(fl=>{
   if(!fl.type||!fl.type.startsWith('image/'))return toast('Selecciona archivos de imagen compatibles.','err');
   if(fl.size>8*1024*1024)return toast('Imagen muy grande (máx 8 MB).','err');
   compress(fl).then(d=>{arr.push(d);renderPreviews(target);}).catch(()=>toast('No se pudo leer una de las imágenes.','err'));
  });inp.value='';
 }
 if(inp.id==='mapcat'){mapCat=inp.value;render();}
});
document.addEventListener('keydown',e=>{if(e.target.id==='global-search'&&e.key==='Enter'){e.preventDefault();GQ=e.target.value.trim();location.hash='#/explorar';render();}});
document.addEventListener('input',e=>{
 if(e.target.id==='global-search'){GQ=e.target.value;return;}
 if(e.target.id==='expq'){GQ=e.target.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{const q=GQ.trim();if(q.length>=2){const u=sess();if(u){DB.activity=Array.isArray(DB.activity)?DB.activity:[];const last=DB.activity.find(a=>a.userId===u.id&&a.type==='search');if(!last||last.q!==q){DB.activity.unshift({id:uid(),userId:u.id,type:'search',q,at:Date.now()});DB.activity=DB.activity.slice(0,1200);save();}}}render();const i=$('#expq');if(i){i.focus();i.setSelectionRange(GQ.length,GQ.length);}},500);}
});
function renderPreviews(target){
 const map={post:['post-previews',postImgs],rep:['rep-previews',repImgs],camp:['camp-previews',campImgs]};
 const [id,arr]=map[target];const el=document.getElementById(id);if(!el)return;
 el.innerHTML=arr.map((p,i)=>`<div class="pv"><img src="${p}"><button type="button" data-del-photo="${target}:${i}">×</button></div>`).join('');
 el.querySelectorAll('[data-del-photo]').forEach(b=>b.onclick=()=>{const [t,i]=b.dataset.delPhoto.split(':');map[t][1].splice(+i,1);renderPreviews(t);});
}
window.addEventListener('hashchange',render);
render();

/* ═════════ EcoNova · Cloud (Supabase) · Fase 1: auth, perfil, feed, publicar, likes, comentarios, guardados, follows, moderación ═════════ */
const Cloud=(()=>{
 const on=()=>Supabase.enabled(),c=()=>supabaseClient;
 const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-/i;
 const ST={approved:'APPROVED',pending:'PENDING',rejected:'REJECTED',hidden:'REMOVED'},ST2={APPROVED:'approved',PENDING:'pending',REJECTED:'rejected',REMOVED:'hidden'};
 const ROLE={MODERATOR:'MOD'},KIND={ORGANIZACION:'ORG'},KIND2={ORG:'ORGANIZACION'};
 let loc2uuid={};
 const tr=e=>{const m=String(e?.message||e||'');
  if(/Invalid login/i.test(m))return'Correo o contraseña incorrectos.';
  if(/already registered|already been registered/i.test(m))return'Ya existe una cuenta con ese correo.';
  if(/not confirmed/i.test(m))return'Confirma tu correo antes de entrar (revisa tu bandeja).';
  if(/at least 6/i.test(m))return'La contraseña necesita al menos 6 caracteres.';
  if(/row-level security|permission denied/i.test(m))return'No tienes permiso para hacer esto.';
  return m||'Ocurrió un error. Intenta de nuevo.';};
 const q=async p=>{const {data,error}=await p;if(error){console.warn('[EcoNova]',error.message);return[];}return data||[];};
 const me=()=>{const u=sess();return u&&UUID.test(u.id)?u:null;};
 const fail=(e,rs=true)=>{console.error(e);toast(tr(e),'err');if(rs)api.sync().then(()=>render()).catch(()=>{});};
 const mk=(o)=>({id:o.id,name:o.name||'Usuario',email:o.email||'',kind:o.kind||'CIUDADANO',role:o.role||'USER',bio:o.bio||'',loc:o.loc||'',website:o.website||'',avatar:o.avatar||'',cover:o.cover||'',verified:!!o.verified,suspended:!!o.suspended,okMail:true,showFollowers:true,showFollowing:true,showPosts:true,privateProfile:false,allowComments:true,notifyLikes:true,notifyComments:true,notifyFollows:true,blockedUsers:[],suspensionUntil:null,banPermanent:false,banReason:'',emblems:[],activity:[],at:o.at||Date.now()});
 const fromProfile=r=>mk({id:r.id,name:r.name||r.username,email:r.email,kind:KIND[r.kind]||r.kind,role:ROLE[r.role]||r.role,bio:r.bio,loc:r.loc,website:r.website,avatar:r.avatar,cover:r.cover,verified:r.verified,suspended:r.is_active===false,at:Date.parse(r.created_at)});
 const split=t=>{const i=t.indexOf('\n\n');return i>0&&i<160?[t.slice(0,i),t.slice(i+2)]:[t.split('\n')[0].slice(0,90),t];};
 async function up(src,folder){if(!src||!String(src).startsWith('data:'))return src||'';const b=await(await fetch(src)).blob();const ext=(b.type.split('/')[1]||'jpg').replace('jpeg','jpg');return(await Supabase.upload(new File([b],'img.'+ext,{type:b.type}),(await c().auth.getUser()).data.user.id,folder)).url;}
 const api={
  async sync(){
   const {data:{session:s}}=await c().auth.getSession();
   const cats=await q(c().from('categories').select('id,name'));
   const {data:rows,error}=await c().from('posts').select('*').order('created_at',{ascending:false}).limit(100);
   if(error)throw error;
   const byName=new Map(DB.cats.map(x=>[x.name.toLowerCase(),x])),u2l={};loc2uuid={};
   cats.forEach(r=>{let l=byName.get(r.name.toLowerCase());if(!l){l={id:Math.max(0,...DB.cats.map(x=>x.id))+1,name:r.name,grp:(CAT_SEED.find(x=>x[0]===r.name)||[])[1]||GRUPOS[GRUPOS.length-1],active:true};DB.cats.push(l);byName.set(r.name.toLowerCase(),l);}u2l[r.id]=l.id;loc2uuid[l.id]=r.id;});
   const ids=rows.map(r=>r.id),has=ids.length>0;
   const [media,cms,lks,svs,fol]=await Promise.all([
    has?q(c().from('post_media').select('post_id,media_url,sort_order').in('post_id',ids).order('sort_order')):[],
    has?q(c().from('comments').select('*').in('post_id',ids).order('created_at')):[],
    has?q(c().from('likes').select('post_id,user_id').in('post_id',ids)):[],
    s?q(c().from('saved_posts').select('post_id').eq('user_id',s.user.id)):[],
    q(c().from('follows').select('follower_id,following_id').limit(2000))]);
   const g=(arr,k,f)=>{const m={};arr.forEach(r=>{(m[r[k]]=m[r[k]]||[]).push(f(r));});return m;};
   const M=g(media,'post_id',r=>r.media_url),L=g(lks,'post_id',r=>r.user_id),S=g(svs,'post_id',()=>s.user.id);
   const C=g(cms.filter(r=>!['rejected','hidden'].includes(r.status)),'post_id',r=>({id:r.id,userId:r.author_id,body:r.content,parentId:r.parent_id,likes:[],at:Date.parse(r.created_at)}));
   const need=new Set([...rows.map(r=>r.author_id),...cms.map(r=>r.author_id)]);if(s)need.add(s.user.id);
   const prof=await q(c().from('profiles').select('*').in('id',[...need]));
   DB.users=prof.map(fromProfile);
   if(s&&!DB.users.some(u=>u.id===s.user.id)){const m=s.user.user_metadata||{};DB.users.push(mk({id:s.user.id,name:m.name||(s.user.email||'').split('@')[0],email:s.user.email,kind:KIND[m.kind]||m.kind}));}
   DB.posts=rows.map(r=>{const [title,body]=split(r.content||'');return{id:r.id,userId:r.author_id,title,body,cat:u2l[r.category_id]??DB.cats[0].id,loc:r.location||'',imgs:M[r.id]||[],tags:(body.match(/#[\wáéíóúñÁÉÍÓÚÑ]+/g)||[]).map(t=>t.slice(1)),status:ST[r.status]||'PENDING',sponsored:false,likes:L[r.id]||[],comments:C[r.id]||[],shares:0,savedBy:S[r.id]||[],at:Date.parse(r.created_at)};});
   DB.follows=fol.map(r=>({f:r.follower_id,t:r.following_id}));
   if(s)store.set('econova_session',s.user.id);else store.del('econova_session');
   save();
  },
  async login(email,pass){
   if(!on()){API.login(email,pass);return;}
   const {error}=await c().auth.signInWithPassword({email:String(email||'').trim(),password:String(pass||'')});
   if(error)throw tr(error);
   await api.sync();
   if(sess()?.suspended){await c().auth.signOut();store.del('econova_session');throw'Tu cuenta está suspendida por el equipo de moderación.';}
  },
  async signup(name,email,pass,kind){
   if(!on()){const nu=API.signup(name,email,pass,kind);store.set('econova_session',nu.id);return'Cuenta creada correctamente. ¡Bienvenido a EcoNova!';}
   name=String(name||'').trim();if(name.length<2)throw'Escribe tu nombre completo.';
   const {data,error}=await c().auth.signUp({email:String(email||'').trim().toLowerCase(),password:String(pass||''),options:{data:{name,kind:KIND2[kind]||kind||'CIUDADANO'}}});
   if(error)throw tr(error);
   if(data.user&&data.user.identities&&data.user.identities.length===0)throw'Ya existe una cuenta con ese correo.';
   if(data.session){await api.sync();return'Cuenta creada correctamente. ¡Bienvenido a EcoNova!';}
   return'Cuenta creada. Confirma tu correo y luego inicia sesión.';
  },
  async pushPost(p){
   const u=me(),{data,error}=await c().from('posts').insert({author_id:u.id,category_id:loc2uuid[p.cat]||null,content:p.title+'\n\n'+p.body,location:p.loc||null,status:ST2[p.status]||'pending'}).select().single();
   if(error){DB.posts=DB.posts.filter(x=>x!==p);save();render();throw error;}
   p.id=data.id;
   const urls=[];
   for(const [i,im] of (p.imgs||[]).entries()){try{const url=await up(im,'posts');urls.push(url);await c().from('post_media').insert({post_id:data.id,media_url:url,media_type:'image',sort_order:i});}catch(e){console.warn('[EcoNova] imagen no subida',e);urls.push(im);}}
   p.imgs=urls;
   if(p.status==='PENDING')await c().from('moderation_queue').insert({content_type:'post',content_id:data.id,submitted_by:u.id,status:'pending'});
   save();render();
  }
 };
 const A={};['createPost','like','comment','replyComment','toggleSave','toggleFollow','moderate','updateProfile','logout'].forEach(k=>A[k]=API[k].bind(API));
 API.createPost=function(d){A.createPost(d);if(!on()||!me())return;api.pushPost(DB.posts[0]).catch(e=>fail(e,false));};
 API.like=function(id){A.like(id);const u=me();if(!on()||!u||!UUID.test(id))return;const liked=postById(id).likes.includes(u.id);
  (liked?c().from('likes').insert({post_id:id,user_id:u.id}):c().from('likes').delete().eq('post_id',id).eq('user_id',u.id)).then(({error})=>{if(error)fail(error);});};
 const pushCm=(id,body,parent)=>{const u=me();if(!on()||!u||!UUID.test(id)||(parent&&!UUID.test(parent)))return;const p=postById(id),cm=p.comments[p.comments.length-1];
  c().from('comments').insert({post_id:id,author_id:u.id,parent_id:parent||null,content:body,status:'approved'}).select().single().then(({data,error})=>{if(error)return fail(error);cm.id=data.id;save();});};
 API.comment=function(id,body){A.comment(id,body);pushCm(id,body,null);};
 API.replyComment=function(id,parent,body){A.replyComment(id,parent,body);pushCm(id,body,parent);};
 API.toggleSave=function(id){const r=A.toggleSave(id),u=me();if(!on()||!u||!UUID.test(id))return r;
  (r?c().from('saved_posts').insert({post_id:id,user_id:u.id}):c().from('saved_posts').delete().eq('post_id',id).eq('user_id',u.id)).then(({error})=>{if(error)fail(error);});return r;};
 API.toggleFollow=function(t){const r=A.toggleFollow(t),u=me();if(!on()||!u||!UUID.test(t))return r;
  (r?c().from('follows').insert({follower_id:u.id,following_id:t}):c().from('follows').delete().eq('follower_id',u.id).eq('following_id',t)).then(({error})=>{if(error)fail(error);});return r;};
 API.moderate=function(id,dec,note){A.moderate(id,dec,note);const u=me();if(!on()||!u||!UUID.test(id)||!ST2[dec])return;
  c().from('posts').update({status:ST2[dec]}).eq('id',id).then(({error})=>{if(error)return fail(error);
   c().from('moderation_queue').update({status:ST2[dec],moderator_id:u.id,moderator_note:note||null,reviewed_at:new Date().toISOString()}).eq('content_id',id).then(()=>{});});};
 API.updateProfile=function(d){A.updateProfile(d);const u=me();if(!on()||!u)return;
  (async()=>{const row={name:u.name,bio:u.bio||null,loc:u.loc||null,website:u.website||null};
   for(const k of['avatar','cover']){if(u[k]){const url=await up(u[k],k==='avatar'?'avatars':'covers');u[k]=url;}row[k]=u[k]||null;}
   const {error}=await c().from('profiles').update(row).eq('id',u.id);if(error)throw error;save();render();})().catch(e=>fail(e));};
 API.logout=function(){A.logout();if(on())c().auth.signOut();};
 if(on()){
  DB.users=[];DB.posts=[];DB.follows=[];DB.notifs=[];DB.flags=[];DB.promos=[];DB.audit=[];
  DB.reports=(DB.reports||[]).filter(r=>UUID.test(r.userId||''));store.del('econova_session');render();
  api.sync().then(()=>render()).catch(e=>{console.error(e);toast('No se pudo conectar con EcoNova. Reintenta en un momento.','err');});
 }
 return api;
})();
