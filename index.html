<style>
:root{
 --bg:#F2F4EF; --surface:#FFFFFF; --ink:#0F1913; --mut:#5B6961; --line:#E5E9E0; --line2:#CDD5C8;
 --green:#0E5C3E; --green-d:#0A3F2A; --green-t:#E1F0E6; --eco:#149A5C; --teal:#0E8F86;
 --amber:#C98A2B; --amber-t:#F7EDDA;
 --red:#B5473A; --red-t:#F6E3E0; --blue:#2F6B9E; --blue-t:#E3EDF6; --yellow:#A98A1F; --yellow-t:#F4EED3;
 --grad:linear-gradient(120deg,#0E5C3E 0%,#176B58 100%);
 --disp:"Sora",sans-serif; --body:"Figtree",sans-serif;
 --r:12px; --r-lg:20px; --sh:0 1px 2px rgba(15,25,19,.05),0 1px 1px rgba(15,25,19,.04); --sh2:0 22px 44px -20px rgba(15,25,19,.30);
 --ring:0 0 0 3px rgba(20,154,92,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);
 color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%} a{color:inherit;text-decoration:none} button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:var(--ring)}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--disp);line-height:1.15;letter-spacing:-.01em}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:12px} .mt1{margin-top:8px}.mt2{margin-top:16px}.mt3{margin-top:26px}.mb2{margin-bottom:16px}
.link{color:var(--green);font-weight:600;font-size:13.5px}.link:hover{text-decoration:underline}
.kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--eco)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;padding:12px 20px;border-radius:9px;border:1.5px solid transparent;transition:.2s cubic-bezier(.2,.7,.3,1);white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-green{background:var(--grad);color:#fff;box-shadow:0 1px 2px rgba(15,25,19,.08)}.btn-green:hover{filter:brightness(1.06);transform:translateY(-1.5px);box-shadow:var(--sh2)}
.btn-ink{background:var(--ink);color:#fff}.btn-ink:hover{transform:translateY(-1.5px);box-shadow:var(--sh2)}
.btn-ghost{border-color:var(--line2);background:var(--surface)}.btn-ghost:hover{border-color:var(--eco);color:var(--green-d)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{filter:brightness(.94);transform:translateY(-1.5px)}
.btn-amber{background:var(--amber);color:#fff}
.btn-sm{padding:7px 13px;font-size:11px} .btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn:active{transform:translateY(0)!important}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:999px;text-transform:uppercase}
.badge svg{width:11px;height:11px}
.b-org{background:var(--green-t);color:var(--green)} .b-emp{background:var(--blue-t);color:var(--blue)} .b-admin{background:var(--ink);color:#fff}
.b-spon{background:var(--amber-t);color:var(--amber)}
.st-pending{background:var(--yellow-t);color:var(--yellow)} .st-approved,.st-verificado,.st-aprobada,.st-pagada{background:var(--green-t);color:var(--green)}
.st-rejected,.st-rechazado,.st-rechazada{background:var(--red-t);color:var(--red)} .st-changes{background:var(--blue-t);color:var(--blue)}
.st-en_revision{background:var(--blue-t);color:var(--blue)} .st-resuelto{background:var(--green-t);color:var(--green)}
.st-voting{background:var(--yellow-t);color:var(--yellow)} .st-scheduled{background:var(--blue-t);color:var(--blue)}
.st-completed{background:var(--green-t);color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line);padding:4px 11px;border-radius:999px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.pad{padding:20px}
.notice{border-left:4px solid var(--blue);background:var(--blue-t);padding:13px 15px;border-radius:0 8px 8px 0;font-size:13.5px}
.notice.warn{border-color:var(--amber);background:var(--amber-t)} .notice.danger{border-color:var(--red);background:var(--red-t)}
.notice.ok{border-color:var(--green);background:var(--green-t)}
/* Marca */

  storageBucket:'econova-media',
  realtimeEnabled:true

const SUPABASE_ENABLED=!!(SUPABASE_CONFIG.url&&SUPABASE_CONFIG.anonKey&&window.supabase?.createClient);
let supabaseClient=null;
if(SUPABASE_ENABLED){try{supabaseClient=window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});}catch(e){console.error('[EcoNova] No se pudo iniciar Supabase:',e);}}
const Supabase={
  enabled(){return !!supabaseClient;},
  async signUp({email,password,name,kind='CIUDADANO'}){
    if(!supabaseClient)throw new Error('Supabase no está configurado todavía.');
    const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{name,kind}}});
    if(error)throw error;return data;
  },
  async signIn(email,password){
    if(!supabaseClient)throw new Error('Supabase no está configurado todavía.');
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error)throw error;return data;
  },
  async signOut(){if(supabaseClient)await supabaseClient.auth.signOut();},
  async currentUser(){if(!supabaseClient)return null;const {data}=await supabaseClient.auth.getUser();return data?.user||null;},
  async upload(file,userId=uid(),folder='uploads'){
    if(!supabaseClient)throw new Error('Supabase no está configurado todavía.');
    const ext=(file.name||'archivo').split('.').pop().toLowerCase();
    const path=`${folder}/${userId}/${Date.now()}-${uid()}.${ext}`;
    const {error}=await supabaseClient.storage.from(SUPABASE_CONFIG.storageBucket).upload(path,file,{upsert:false,contentType:file.type||undefined});
    if(error)throw error;
    const {data}=supabaseClient.storage.from(SUPABASE_CONFIG.storageBucket).getPublicUrl(path);
    return {path,url:data.publicUrl};
  },
  async insert(table,row){if(!supabaseClient)throw new Error('Supabase no está configurado todavía.');const {data,error}=await supabaseClient.from(table).insert(row).select().single();if(error)throw error;return data;},
  async update(table,values,match){if(!supabaseClient)throw new Error('Supabase no está configurado todavía.');let q=supabaseClient.from(table).update(values);Object.entries(match||{}).forEach(([k,v])=>{q=q.eq(k,v);});const {data,error}=await q.select();if(error)throw error;return data;},
  async list(table,query=()=>{}){if(!supabaseClient)throw new Error('Supabase no está configurado todavía.');let q=supabaseClient.from(table).select('*');q=query(q)||q;const {data,error}=await q;if(error)throw error;return data||[];},
  subscribe(channelName,table,callback){if(!supabaseClient||!SUPABASE_CONFIG.realtimeEnabled)return null;return supabaseClient.channel(channelName).on('postgres_changes',{event:'*',schema:'public',table},payload=>callback(payload)).subscribe();},
  removeSubscription(channel){if(supabaseClient&&channel)supabaseClient.removeChannel(channel);}
};

const store={_m:{},
 get(k){try{return localStorage.getItem(k);}catch(e){return this._m[k]??null;}},
 set(k,v){try{localStorage.setItem(k,v);}catch(e){this._m[k]=v;}},
 del(k){try{localStorage.removeItem(k);}catch(e){}delete this._m[k];}};

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('es-MX')+' MXN';
const dShort=t=>new Date(t).toLocaleDateString('es-MX',{day:'numeric',month:'short'});
const dLong=t=>new Date(t).toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});
const timeAgo=t=>{const m=Math.round((Date.now()-t)/6e4);if(m<1)return'ahora';if(m<60)return`hace ${m} min`;const h=Math.round(m/60);if(h<24)return`hace ${h} h`;const d=Math.round(h/24);if(d<30)return`hace ${d} d`;return dShort(t);};
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h;};
const img=(s,w=800,h=560)=>`https://picsum.photos/seed/${s}/${w}/${h}`;
function avatar(u,sz=38,fs=14){if(u?.avatar)return`<span class="avt avt-photo" style="width:${sz}px;height:${sz}px;background-image:url('${u.avatar}')" aria-label="Foto de ${esc(u.name)}"></span>`;return`<span class="avt" style="width:${sz}px;height:${sz}px;font-size:${fs}px;background:hsl(${hue(u.id)} 42% 36%)">${initials(u.name)}</span>`;}

function csWrap(ctx,text,maxW,maxLines){const out=[];let line='';const toks=/\s/.test(text)?text.split(/(\s+)/):text.split('');
 for(const w of toks){const t=line+w;if(ctx.measureText(t).width>maxW&&line){out.push(line.trim());line=w.trim()?w:'';}else line=t;}
 if(line.trim())out.push(line.trim());
 if(out.length>maxLines){out.length=maxLines;let l=out[maxLines-1];while(l.length>1&&ctx.measureText(l+'…').width>maxW)l=l.slice(0,-1);out[maxLines-1]=l+'…';}
 return out;}
function csRR(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

async function csLoad(src){if(!src)return null;
 if(/^(data|blob):/.test(src))return csImg(src);
 /* 1) descargar la foto como archivo (evita el error de CORS/caché de Safari al dibujarla en el canvas) */
 try{const r=await fetch(src,{mode:'cors',cache:'no-store'});if(r.ok){const b=await r.blob(),u=URL.createObjectURL(b),im=await csImg(u);if(im)return im;}}catch(e){}
 /* 2) reintento con la dirección distinta para saltar la caché del navegador */
 const abs=/^https?:/.test(src);
 return csImg(abs?src+(src.indexOf('?')>-1?'&':'?')+'cb='+Date.now():src);}

let DB;const DBK='econova_db_v3';
function save(){try{store.set(DBK,JSON.stringify(DB));}catch(e){toast('No se pudo guardar','err');}}
function load(){
  const r=store.get(DBK);
  let loaded=false;
  if(r){
    try{
      const parsed=JSON.parse(r);
      if(parsed&&Array.isArray(parsed.users)&&Array.isArray(parsed.posts)){
        DB=parsed;
        loaded=true;
      }
    }catch(e){
      console.warn('[EcoNova] No se pudo leer la base local guardada.',e);
    }
  }
  if(!loaded) DB=seed();
  DB.users=Array.isArray(DB.users)?DB.users:[];
  DB.posts=Array.isArray(DB.posts)?DB.posts:[];
  const admin=DB.users.find(u=>u.id==='u1');
  if(admin){admin.email='admin@econova.mx';admin.pass='1234';admin.okMail=true;admin.role='DEV';admin.kind='ADMIN';}
  const citizen=DB.users.find(u=>u.id==='u2');
  if(citizen){citizen.email='ciudadano@econova.mx';citizen.pass='1234';citizen.okMail=true;citizen.kind='CIUDADANO';}
  if(!DB.users.some(u=>u.id==='umod')) DB.users.push({id:'umod',name:'Moderador EcoNova',email:'moderador@econova.mx',pass:'1234',kind:'CIUDADANO',role:'MOD',bio:'Moderación de la comunidad EcoNova.',loc:'Ciudad de México',verified:false,suspended:false,okMail:true,showFollowers:true,showFollowing:true,showPosts:true,privateProfile:false,allowComments:true,notifyLikes:true,notifyComments:true,notifyFollows:true,blockedUsers:[],suspensionUntil:null,banPermanent:false,banReason:'',website:'',avatar:'',at:Date.now()});
  cleanupDemoContent();
  save();
}
function cleanupDemoContent(){
  // Elimina únicamente las cuentas de demostración originales.
  // Los usuarios registrados posteriormente deben conservarse.
  const demoUserIds=new Set(['u3','u4','u5','u6','u7','u8']);
  DB.users=(DB.users||[]).filter(u=>!demoUserIds.has(u.id));
  const validIds=new Set(DB.users.map(u=>u.id));
  DB.posts=(DB.posts||[]).filter(p=>validIds.has(p.userId)).map(p=>{
    p.likes=(p.likes||[]).filter(id=>validIds.has(id));
    p.savedBy=(p.savedBy||[]).filter(id=>validIds.has(id));
    p.comments=(p.comments||[]).filter(c=>validIds.has(c.userId));
    return p;
  });
  if(Array.isArray(DB.campaigns))DB.campaigns=DB.campaigns.filter(c=>!c.orgId||validIds.has(c.orgId));
  if(Array.isArray(DB.orgRequests))DB.orgRequests=DB.orgRequests.filter(r=>validIds.has(r.userId));
  if(Array.isArray(DB.notifications))DB.notifications=DB.notifications.filter(n=>validIds.has(n.userId)||validIds.has(n.to));
  if(Array.isArray(DB.follows))DB.follows=DB.follows.filter(f=>validIds.has(f.from)||validIds.has(f.to)||validIds.has(f.userId));
}

const API={
 notify(uid_,title,body='',x){DB.notifs.unshift(Object.assign({id:uid(),userId:uid_,title,body,at:Date.now(),read:false},x||{}));},
 audit(action){DB.audit.unshift({id:uid(),admin:sess()?.id||'u1',action,at:Date.now()});},
 signup(name,email,pass,kind){
  if(DB.users.some(u=>u.email===email.toLowerCase()))throw'Ya existe una cuenta con ese correo.';
  name=String(name||'').trim();email=String(email||'').trim().toLowerCase();pass=String(pass||'');kind=kind||'CIUDADANO';if(name.length<2)throw'Escribe tu nombre completo.';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw'Escribe un correo electrónico válido.';if(pass.length<4)throw'La contraseña necesita al menos 4 caracteres.';
  const u={id:uid(),name:name.trim(),email:email.toLowerCase(),pass,kind,role:'USER',bio:'',loc:'',verified:false,suspended:false,okMail:true,showFollowers:true,showFollowing:true,showPosts:true,privateProfile:false,allowComments:true,notifyLikes:true,notifyComments:true,notifyFollows:true,blockedUsers:[],suspensionUntil:null,banPermanent:false,banReason:'',bio:'',loc:'',website:'',avatar:'',at:Date.now()};
  DB.users.push(u);save();store.set('econova_pending',u.id);return u;},
 verify(code){
  if(code.trim()!=='123456')throw'Código incorrecto. Revisa tu correo (demo: 123456).';

 login(email,pass){
  const alias=String(email||'').trim().toLowerCase();
  const aliases={'admin':'admin@econova.mx','admin@econova.mx':'admin@econova.mx','ciudadano':'ciudadano@econova.mx','ciudadano@econova.mx':'ciudadano@econova.mx','moderador':'moderador@econova.mx','moderador@econova.mx':'moderador@econova.mx'};
  const loginEmail=aliases[alias]||alias;
  const u=DB.users.find(x=>x.email.toLowerCase()===loginEmail&&x.pass===pass);
  if(!u)throw'Correo o contraseña incorrectos.';
  if(u.banPermanent)throw`Tu cuenta fue bloqueada permanentemente por el equipo de moderación.${u.banReason?' Motivo: '+u.banReason:''}`;
  if(u.suspensionUntil&&Date.now()<u.suspensionUntil)throw`Tu cuenta está suspendida temporalmente hasta ${new Date(u.suspensionUntil).toLocaleString('es-MX')}.${u.banReason?' Motivo: '+u.banReason:''}`;
  if(u.suspensionUntil&&Date.now()>=u.suspensionUntil){u.suspensionUntil=null;u.suspended=false;save();}
  if(u.suspended)throw`Tu cuenta está suspendida por el equipo de moderación.${u.banReason?' Motivo: '+u.banReason:''}`;

 createPost(d){
  const u=sess();if(!u)throw'Inicia sesión para publicar.';
  const unrestricted=u.role==='DEV'||u.role==='ADMIN'||u.role==='MOD'||u.id==='u1';
  const today=new Date().setHours(0,0,0,0);

  const tags=(d.body.match(/#[\wáéíóúñÁÉÍÓÚÑ]+/g)||[]).map(t=>t.slice(1));
  DB.posts.unshift({id:uid(),userId:u.id,title:d.title,body:d.body,cat:+d.cat,loc:d.loc,imgs:d.imgs,tags,status:unrestricted?'APPROVED':'PENDING',sponsored:false,likes:[],comments:[],shares:0,savedBy:[],at:Date.now()});save();},
 moderate(id,dec,note){
  const p=postById(id);p.status=dec;p.modNote=note||'';
  if(dec==='APPROVED')this.notify(p.userId,'Tu publicación fue aprobada',`"${p.title}" ya es visible para la comunidad.`);

  if(dec==='REJECTED')this.notify(p.userId,'Tu publicación fue rechazada',note||'');

 setEmblem(id,code){if(!isDeveloper())throw'Solo el creador de EcoNova puede dar o quitar emblemas.';const u=userById(id);if(!u||u.id==='?')throw'Usuario no encontrado.';if(code==='ECONOVA'&&!isDeveloper())throw'Solo el desarrollador puede asignar el emblema EcoNova.';if(code==='ECONOVA'&&u.id!=='u1')throw'El emblema EcoNova es único y pertenece al perfil oficial de EcoNova.';if(code==='ALLY'&&!['ORG','EMPRESA'].includes(u.kind))throw'El emblema Empresa aliada solo puede darse a empresas u organizaciones.';if(code==='MOD'&&u.role!=='MOD')u.role='MOD';u.emblems=Array.isArray(u.emblems)?u.emblems:[];if(code==='ECONOVA'){DB.users.forEach(x=>{x.emblems=(Array.isArray(x.emblems)?x.emblems:[]).filter(e=>e!=='ECONOVA');});u.emblems=['ECONOVA'];u.name='EcoNova';u.role='DEV';u.kind='ADMIN';u.verified=true;}else if(!u.emblems.includes(code)){u.emblems.push(code);}u.allyAccepted=u.emblems.includes('ALLY');u.donorAccepted=u.emblems.includes('DONOR');this.audit(`Asignó el emblema ${code} a ${u.name}`);save();},
 removeEmblem(id,code){if(!isDeveloper())throw'Solo el creador de EcoNova puede dar o quitar emblemas.';const u=userById(id);if(!u||u.id==='?')throw'Usuario no encontrado.';if(code==='ECONOVA')throw'El emblema EcoNova no puede quitarse del perfil oficial.';u.emblems=(Array.isArray(u.emblems)?u.emblems:[]).filter(e=>e!==code);u.allyAccepted=u.emblems.includes('ALLY');u.donorAccepted=u.emblems.includes('DONOR');if(code==='MOD'&&u.role==='MOD')u.role='USER';this.audit(`Quitó el emblema ${code} a ${u.name}`);save();},
 clearActivity(){const u=sess();if(!u)throw'Inicia sesión.';DB.activity=DB.activity.filter(a=>a.userId!==u.id||a.type==='like'||a.type==='save');save();},
 updateProfile(d){const u=sess();if(!u)throw'Inicia sesión.';const name=String(d.name||'').trim();if(name.length<2)throw'El nombre debe tener al menos 2 caracteres.';u.name=name.slice(0,80);u.bio=String(d.bio||'').trim().slice(0,300);u.loc=String(d.loc||'').trim().slice(0,100);u.website=String(d.website||'').trim().slice(0,180);u.avatar=String(d.avatar||'');if(d.cover!==undefined)u.cover=String(d.cover||'');save();},
 updatePrivacy(d){const u=sess();if(!u)throw'Inicia sesión.';u.showFollowers=!!d.showFollowers;u.showFollowing=!!d.showFollowing;u.showPosts=!!d.showPosts;u.privateProfile=!!d.privateProfile;u.allowComments=d.allowComments!==false;u.notifyLikes=d.notifyLikes!==false;u.notifyComments=d.notifyComments!==false;u.notifyFollows=d.notifyFollows!==false;save();}
};

let GQ='';
const normQ=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const cur=[i];let min=i;for(let j=1;j<=b.length;j++){const v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));cur[j]=v;if(v<min)min=v;}if(min>max)return max+1;prev=cur;}return prev[b.length];}
function tokScore(t,words){let best=0;const allow=t.length<=3?0:t.length<=5?1:2;for(const w of words){let sc=0;if(w===t)sc=3;else if(w.startsWith(t))sc=2.5;else if(t.length>=3&&w.includes(t))sc=2;else if(allow){const d=Math.min(lev(t,w,allow),lev(t,w.slice(0,t.length),allow));if(d<=allow)sc=1.6-d*.3;}if(sc>best)best=sc;if(best===3)break;}return best;}
function fuzzyScore(q,fields){const toks=normQ(q).split(' ').filter(Boolean);if(!toks.length)return 0;const wl=fields.map(([t,w])=>[normQ(t).split(' ').filter(Boolean),w]);let total=0;for(const t of toks){let best=0;for(const [words,w] of wl){const sc=tokScore(t,words)*w;if(sc>best)best=sc;}if(!best)return 0;total+=best;}return total/toks.length;}
function exploreResults(){
 const q=GQ.trim();

 const renderComment=(c,depth=0)=>{const cu=userById(c.userId);const likes=Array.isArray(c.likes)?c.likes:[];const liked=me&&likes.includes(me.id);const replies=comments.filter(r=>r.parentId===c.id);return `<div class="comment-row" style="margin-left:${Math.min(depth,3)*18}px">${avatar(cu,34,11)}<div class="comment-body"><div><b><a href="#/perfil/${cu.id}">${esc(cu.name)}</a></b>${cu.verified?verifyBadge():''}<span class="xs mut"> · ${timeAgo(c.at)}</span></div><div class="mt1">${ecoCmHTML(c.body)}</div><div class="comment-actions"><button class="${liked?'act':''}" data-action="comment-like" data-p="${p.id}" data-c="${c.id}">${ic('heart')} ${likes.length}</button><button data-action="comment-reply" data-p="${p.id}" data-c="${c.id}">${ic('msg')} Responder</button>${(me&&(c.userId===me.id||isAdmin()))?`<button data-action="cm-del-page" data-p="${p.id}" data-c="${c.id}">${ic('trash')} Eliminar</button>`:''}</div>${replies.map(r=>renderComment(r,depth+1)).join('')}</div></div>`;};

function pushCard(){

 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 const supported=('Notification' in window)&&('serviceWorker' in navigator)&&('PushManager' in window);
 let title='Notificaciones',msg='',btn='';
 if(!supported){
  if(ios&&!standalone){title='Activa las notificaciones';msg='Para recibir avisos en tu iPhone, abre EcoNova desde el ícono de tu pantalla de inicio. Si aún no la agregaste: Safari → Compartir → Añadir a pantalla de inicio.';}

 }
 else if(Notification.permission==='denied'){title='Notificaciones desactivadas';msg='Para recibir avisos, actívalas en Ajustes del teléfono → Notificaciones → EcoNova.';}
 else if(Notification.permission==='granted'){title='Notificaciones activadas ✅';msg='Recibirás avisos de likes, comentarios y nuevos seguidores aunque la app esté cerrada.';btn='<button class="btn btn-ghost btn-sm" data-action="push-enable">Volver a activar</button>';}

 return `<div class="card pad mt2"><b>${title}</b><p class="sm mut" style="margin:6px 0 ${btn?'10px':'0'}">${msg}</p>${btn}</div>`;
}

const ECO_DEL_KEY='econova-deleted-notifs-v1';
function ecoDeletedNotifs(){try{return new Set(JSON.parse(localStorage.getItem(ECO_DEL_KEY)||'[]'));}catch(_){return new Set();}}
function ecoMarkDeletedNotifs(ids){try{const a=[...ecoDeletedNotifs(),...ids];localStorage.setItem(ECO_DEL_KEY,JSON.stringify(a.slice(-500)));}catch(_){}}
let ECO_CONFIRM_CB=null;
function ecoConfirm(msg,cb,okLabel){ECO_CONFIRM_CB=cb;modal(`<h3>${esc(msg)}</h3><div style="display:flex;gap:8px;margin-top:16px"><button type="button" class="btn btn-danger" data-action="eco-confirm-yes">${esc(okLabel||'Eliminar')}</button><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button></div>`);}
function ecoRemoveNotifs(list){
 const ids=list.map(n=>n.id);ecoMarkDeletedNotifs(ids);
 const set=new Set(ids);DB.notifs=DB.notifs.filter(x=>!set.has(x.id));save();
 list.filter(n=>n.remote).forEach(n=>{try{window.__ecoDeleteNotification&&window.__ecoDeleteNotification(n.id);}catch(_){}});
 toast(ids.length>1?'Notificaciones eliminadas.':'Notificación eliminada.','ok');render();
}
/* EcoNova: mantener la posición exacta al volver a pintar la misma pantalla (like, guardar, comentar…) */
let ECO_USER_SCROLLED=false;
['wheel','touchstart','keydown','mousedown'].forEach(ev=>window.addEventListener(ev,()=>{ECO_USER_SCROLLED=true;},{passive:true,capture:true}));
function ecoScrollAnchor(){
 const els=document.querySelectorAll('article.post[id], .comment-row');
 for(const el of els){const r=el.getBoundingClientRect();if(r.bottom>80&&el.id)return{id:el.id,top:r.top};}
 return null;
}
let ECO_CARPOS=null;
function ecoCarSave(){const m={};document.querySelectorAll('.eco-track[data-car]').forEach(t=>{if(t.scrollLeft>2)m[t.dataset.car]=Math.round(t.scrollLeft/Math.max(1,t.clientWidth));});return m;}
function ecoCarRestore(m){if(!m)return;document.querySelectorAll('.eco-track[data-car]').forEach(t=>{const n=m[t.dataset.car];if(n==null)return;const x=n*t.clientWidth;if(Math.abs(t.scrollLeft-x)>2){t.style.scrollBehavior='auto';t.scrollLeft=x;}});}
function ecoRestoreScroll(y,anchor){ecoCarRestore(ECO_CARPOS);
 const root=document.documentElement,prev=root.style.scrollBehavior;
 root.style.scrollBehavior='auto';
 let done=false;
 if(anchor){const el=document.getElementById(anchor.id);if(el){window.scrollTo(0,Math.max(0,window.scrollY+el.getBoundingClientRect().top-anchor.top));done=true;}}
 if(!done)window.scrollTo(0,y);
 if(ECO_LOCK.n)ECO_LOCK.y=window.scrollY||0;
 root.style.scrollBehavior=prev;
}
/* EcoNova: bloqueo del feed mientras hay una hoja abierta (comentarios, me gusta, racha) y restauración exacta al cerrarla */
const ECO_LOCK={keys:new Set(),y:0,anchor:null,hash:'',get n(){return this.keys.size;}};
let ECO_LAST_MOVE=0;
['touchmove','wheel'].forEach(ev=>window.addEventListener(ev,()=>{ECO_LAST_MOVE=Date.now();},{passive:true,capture:true}));
function ecoLockGuard(){
 if(!ECO_LOCK.n)return;
 if(Math.abs((window.scrollY||0)-ECO_LOCK.y)>1){const r=document.documentElement,p=r.style.scrollBehavior;r.style.scrollBehavior='auto';window.scrollTo(0,ECO_LOCK.y);r.style.scrollBehavior=p;}
}
function ecoLockFocus(){[0,80,200,400,700].forEach(ms=>setTimeout(ecoLockGuard,ms));}
function ecoLockPage(key){
 if(ECO_LOCK.keys.has(key))return;
 const first=!ECO_LOCK.n;ECO_LOCK.keys.add(key);
 if(!first)return;
 ECO_LOCK.y=window.scrollY||0;ECO_LOCK.anchor=ecoScrollAnchor();ECO_LOCK.hash=location.hash||'#/';
 document.body.style.overflow='hidden';
 window.addEventListener('scroll',ecoLockGuard,{passive:true});
 document.addEventListener('focusin',ecoLockFocus,true);
}
function ecoUnlockPage(key){
 if(!ECO_LOCK.keys.delete(key)||ECO_LOCK.n)return;
 window.removeEventListener('scroll',ecoLockGuard);document.removeEventListener('focusin',ecoLockFocus,true);
 const y=ECO_LOCK.y,anchor=ECO_LOCK.anchor,h=ECO_LOCK.hash,t=Date.now();ECO_LOCK.anchor=null;

/* evita que lo que se desliza dentro de una hoja arrastre el feed (límites de scroll incluidos) */
function ecoTrapScroll(root){
 if(!root||root._trap)return;root._trap=1;let sy=0,sc=null;
 const scroller=t=>{while(t&&t!==root){if(t.nodeType===1){const o=getComputedStyle(t).overflowY;if((o==='auto'||o==='scroll')&&t.scrollHeight>t.clientHeight+1)return t;}t=t.parentNode;}return (root.scrollHeight>root.clientHeight+1&&/auto|scroll/.test(getComputedStyle(root).overflowY))?root:null;};
 root.addEventListener('touchstart',e=>{if(!e.touches[0])return;sy=e.touches[0].clientY;sc=scroller(e.target);},{passive:true});
 root.addEventListener('touchmove',e=>{if(!e.cancelable||!e.touches[0])return;const dy=e.touches[0].clientY-sy;if(!sc){e.preventDefault();return;}const top=sc.scrollTop<=0,bot=sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1;if((dy>0&&top)||(dy<0&&bot))e.preventDefault();},{passive:false});
}

 },ms));
}

function ecoCmParts(b){b=String(b||'');const m=b.match(/^\[\[(img|stk):([^\]]+)\]\]\s*/);if(!m)return{text:b};const t=b.slice(m[0].length);if(m[1]==='stk'){const x=(window.ECO_STK||{})[m[2]];return x?{stk:x,text:t}:{text:t};}return{img:m[2],text:t};}
function ecoCmHTML(b){const q=ecoCmParts(b);return(q.text?`<div class="cm-t">${esc(q.text)}</div>`:'')+(q.stk?`<img class="cm-stk" src="${q.stk}" alt="Sticker">`:'')+(q.img?`<img class="cm-img" src="${esc(q.img)}" data-action="cm-img" alt="Imagen">`:'');}
function ecoCmShrink(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=()=>rej();rd.onload=()=>{const im=new Image();im.onerror=()=>rej();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78));};im.src=rd.result;};rd.readAsDataURL(file);});}
document.addEventListener('change',e=>{const inp=e.target;if(!inp.matches||!inp.matches('.sf-file'))return;const f=inp.closest('form'),file=inp.files&&inp.files[0];inp.value='';if(!f||!file)return;if(!/^image\//.test(file.type)){toast('Elige una imagen.','err');return;}
 ecoCmShrink(file).then(d=>{f._img=d;f._stk=null;f.querySelector('.sf-prev img').src=d;f.querySelector('.sf-prev').hidden=false;f.classList.add('has-img');f.querySelector('input').focus();}).catch(()=>toast('No se pudo leer la imagen.','err'));});
function ecoSheetHTML(p){
 const me=sess(),cs=Array.isArray(p.comments)?p.comments:[],S=window._ecoThreads||new Map(),K=window._ecoKeep||new Set(),PG=10;
 const SV=(d,x)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${x||''}>${d}</svg>`;
 const IMG=SV('<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="1.8"/><path d="M21 15l-5-5L5 21"/>');
 const STK=SV('<path d="M21 11V8a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v8a5 5 0 0 0 5 5h4"/><path d="M21 11c0 5.5-4 10-9 10 0-5 4-10 9-10z"/><path d="M8.5 9.5v1M14.5 9.5v1M8.5 14c1 1 3 1 4 0"/>');
 const CAM=SV('<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>');
 const row=(c,rp,hid)=>{const cu=userById(c.userId),lk=Array.isArray(c.likes)?c.likes:[],on=me&&lk.includes(me.id);const lk0=cu.id&&cu.id!=='?'?'#/perfil/'+cu.id:'';const A=h=>lk0?`<a class="cm-u" href="${lk0}">${h}</a>`:h;return `<div class="cm${rp?' rp':''}"${hid?' hidden':''} data-cid="${c.id}">${A(avatar(cu,rp?32:44,rp?11:15))}<div class="cm-b"><div class="cm-n">${A(esc(cu.name))}<small>${timeAgo(c.at)}</small></div>${ecoCmHTML(c.body)}<div class="cm-a"><button type="button" data-action="sheet-reply" data-p="${p.id}" data-c="${c.id}" data-n="${esc(cu.name)}">Responder</button></div></div><button type="button" class="cm-lk ${on?'act':''}" data-action="comment-like" data-p="${p.id}" data-c="${c.id}">${ic('heart')} ${lk.length}</button></div>`;};
 const kids=id=>cs.filter(r=>r.parentId===id),desc=id=>kids(id).flatMap(r=>[r,...desc(r.id)]);
 const top=cs.filter(c=>!c.parentId),empty=!top.length;
 const thread=c=>{const d=desc(c.id),n=d.length,sh=Math.min(S.get(c.id)||0,n);if(!n)return row(c,false);const vis=d.filter((r,i)=>i<sh||K.has(r.id)).length,rem=n-vis;return row(c,false)+`<div class="rps" data-c="${c.id}">${d.map((r,i)=>row(r,true,!(i<sh||K.has(r.id)))).join('')}</div><button type="button" class="cm-more" data-action="sheet-replies" data-c="${c.id}"${rem>0?'':' hidden'}>Ver ${rem} ${rem===1?'respuesta más':'respuestas más'}</button><button type="button" class="cm-more cm-hide" data-action="sheet-replies-x" data-c="${c.id}"${vis>0?'':' hidden'}>Ocultar respuestas</button>`;};

 let mode,inner,label;
 if(n>=3){mode='badge';inner=ecoBadge(ecoStreakAch(n),true,36,{num:n,tier});label=`Racha de ${n} días`;}
 else if(n>=1){mode='days';inner=`<span class="f-fl">🔥</span><b>${n}</b>`;label=`Racha de ${n} ${ecoPl(n,'día','días')}`;}
 else if(rec>0){mode='lost';inner=`<span class="f-fl">🏅</span><b>${rec}</b>`;label=`Tu récord es de ${rec} días`;}
 else{mode='none';inner='<span class="f-fl">🌱</span>';label='Empieza tu racha';}
 return`<button type="button" id="eco-streak-fab" class="m-${mode} ${tier?'tr-'+tier:''} ${s.doneToday?'done':''} ${ECO_FAB_HIDE?'hide':''}" aria-label="${label}. Ver mi progreso" title="${label}"><svg class="f-ring" viewBox="0 0 56 56" aria-hidden="true"><circle class="bg" cx="28" cy="28" r="${R}"/><circle class="pg" ${pct>0?'':'style="opacity:0" '}cx="28" cy="28" r="${R}" stroke-dasharray="${dash} ${C.toFixed(1)}" transform="rotate(-90 28 28)"/></svg><span class="f-in">${inner}</span>${n>0&&!s.doneToday?'<i class="f-dot"></i>':''}</button>`;

 if(el)el.outerHTML=html;else document.body.insertAdjacentHTML('beforeend',html);
 if(pulse){el=document.getElementById('eco-streak-fab');if(el){el.classList.remove('hide');ECO_FAB_HIDE=false;el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');}}

document.addEventListener('submit',e=>{

/* ── Celebración al desbloquear ── */
function ecoAchPop(a){
 const old=document.getElementById('eco-ach-pop');if(old)old.remove();
 const e=document.createElement('a');e.id='eco-ach-pop';e.href='#/logros';
 e.innerHTML=`<span class="ap-ic">${ecoBadge(a,true,56)}</span><div><small>¡Insignia ${ECO_TIERS[a.tier].toLowerCase()} desbloqueada!</small><b>${esc(a.n)}</b><span>${esc(a.d)}</span></div>`;
 document.body.appendChild(e);requestAnimationFrame(()=>e.classList.add('on'));
 try{ecoHaptic();}catch(_){}
 ['🎉','✨','💚','🌟','🎊','✨'].forEach((em,i)=>{const t=document.createElement('span');t.className='eco-burst';t.textContent=em;t.style.cssText='left:'+(innerWidth/2-10+(i-2.5)*34)+'px;top:80px;--dx:'+((i-2.5)*14)+'px;animation-delay:'+(i*60)+'ms;font-size:22px';document.body.appendChild(t);setTimeout(()=>t.remove(),1100);});
 try{if(window.EcoAV)EcoAV.mood('emocionado',2800);}catch(_){}
 try{ecoFabSync(true);}catch(_){}
 setTimeout(()=>{e.classList.remove('on');setTimeout(()=>e.remove(),400);},4800);
}
function ecoAchCheck(){
 const u=sess();if(!u)return;
 const{s,list}=ecoAchList(u.id),key='econova-ach-seen-v1-'+u.id,done=list.filter(a=>a.done).map(a=>a.id);
 let seen=null;try{seen=JSON.parse(localStorage.getItem(key)||'null');}catch(_){}
 if(!Array.isArray(seen)){
  if(!DB.posts.some(p=>Array.isArray(p.comments)&&p.comments.length))return; /* esperar a que carguen los datos */
  try{localStorage.setItem(key,JSON.stringify(done));}catch(_){}return;
 }
 const fresh=list.filter(a=>a.done&&!seen.includes(a.id));if(!fresh.length)return;
 try{localStorage.setItem(key,JSON.stringify([...new Set(seen.concat(done))]));}catch(_){}
 if(Date.now()-s.lastAt>180000)return; /* solo celebra si fue por una acción reciente */
 ecoAchPop(fresh[fresh.length-1]);
}

  async pushPost(p,vf){

   if(!loc2uuid[p.cat]){

   }

   if(!categoryId)throw new Error('La categoría de la publicación no está disponible en Supabase. Recarga la página e inténtalo de nuevo.');

   // Subir primero los archivos. No crear una publicación incompleta si falla un video.
   const mediaRows=[];
   for(const [i,im] of (p.imgs||[]).entries()){
    try{const url=await up(im,'posts');mediaRows.push({media_url:url,media_type:'image',sort_order:i});}

   }

   let postId=null;
   try{
    const {data,error}=await c().from('posts').insert({
     author_id:u.id,category_id:categoryId,
     content:String(p.title||'').trim()+'\n\n'+String(p.body||'').trim(),
     location:p.loc||null,status:ST2[p.status]||'pending',
     shared_from:(p.sharedFrom&&UUID.test(p.sharedFrom))?p.sharedFrom:null
    }).select().single();

    const oldId=p.id;p.id=data.id;

    p.video=(mediaRows.find(m=>m.media_type==='video')||{}).media_url||'';
    if(p.status==='PENDING'){
     const qr=await c().from('moderation_queue').insert({content_type:'post',content_id:postId,submitted_by:u.id,status:'pending'});
     if(qr.error)throw qr.error;

   }catch(e){

    if(postId){

     await c().from('post_media').delete().eq('post_id',postId);

   }

  }

/* ═════════ EcoNova · Campañas en Supabase (aprobación + eliminar) ═════════
   Tablas: campaigns_v2 y campaign_actions (ver econova_campanas.sql). Las acciones de la gente
   (votar, unirse/firmar, aportar, avance diario) se aplican al instante y se guardan en segundo plano. */
var CampX=(()=>{
 const sb=()=>supabaseClient,enabled=()=>Supabase.enabled(),UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-/i;
 const T='campaigns_v2',A='campaign_actions';
 const me=()=>{const u=sess();return u&&UUID.test(u.id)?u.id:null;};
 const ms=x=>x?Date.parse(x):0,iso=x=>x?new Date(x).toISOString():null;
 const PH={voting:'VOTING',scheduled:'SCHEDULED',active:'ACTIVE',completed:'COMPLETED',cancelled:'CANCELLED'};
 let warned=false;
 const err=e=>e&&(e.code==='42P01'||/campaigns_v2|campaign_actions/.test(e.message||''))?'Faltan las tablas de campañas en Supabase (corre econova_campanas.sql).':((e&&e.message)||String(e));
 function toLocal(r,acts){
  const mem=acts.filter(a=>a.kind==='member'),vt=acts.filter(a=>a.kind==='vote'),pl=acts.filter(a=>a.kind==='pledge'),ck=acts.filter(a=>a.kind==='checkin');
  const cat=DB.cats.find(x=>x.name===r.category)||DB.cats[0];
  const c={id:r.id,orgId:r.owner_id,type:r.type,name:r.name,desc:r.description||'',kind:r.kind||'Otra',cat:cat?cat.id:0,place:r.place||'',lat:r.latitude??19.435,lng:r.longitude??-99.135,max:r.max_participants||0,status:PH[r.phase]||'ACTIVE',img:r.image_url||img('campana-'+r.id,600,450),selected:r.selected_option||null,participants:mem.map(a=>({userId:a.user_id,at:ms(a.created_at)})),result:r.result||null,at:ms(r.created_at),mod:r.moderation_status,modNote:r.moderator_note||'',
   opts:(Array.isArray(r.date_options)?r.date_options:[]).map(o=>({id:o.id,label:o.label,dt:+o.dt,votes:vt.filter(v=>v.option_id===o.id).map(v=>v.user_id)}))};
  if(r.goal!=null)c.goal=+r.goal;if(r.beneficiary)c.ben=r.beneficiary;if(r.address_to)c.addr=r.address_to;
  if(Array.isArray(r.items)){c.items=r.items.map((it,i)=>({n:it.n,goal:+it.goal||0,got:pl.filter(p=>p.item_idx===i).reduce((a,p)=>a+(+p.qty||0),0)}));c.pledges=pl.map(p=>({userId:p.user_id,i:p.item_idx,qty:+p.qty,at:ms(p.created_at)}));}
  if(r.days)c.days=r.days;if(r.starts_at)c.when=ms(r.starts_at);if(r.ends_at)c.until=ms(r.ends_at);if(r.link)c.link=r.link;
  if(r.type==='RETO'){c.checks={};ck.forEach(a=>{(c.checks[a.user_id]=c.checks[a.user_id]||[]).push(String(a.day).slice(0,10));});}
  return c;}
 async function load(){
  if(!enabled())return;
  const {data,error}=await sb().from(T).select('*').order('created_at',{ascending:false}).limit(300);
  if(error){console.error('[EcoNova] campañas',error);if(!warned){warned=true;toast('No se pudieron cargar las campañas: '+err(error),'err');}DB.campaigns=[];return;}
  let acts=[];
  if((data||[]).length){const q=await sb().from(A).select('*').order('created_at').limit(5000);if(q.error)console.error('[EcoNova] acciones de campañas',q.error);else acts=q.data||[];}
  const by={};acts.forEach(a=>{(by[a.campaign_id]=by[a.campaign_id]||[]).push(a);});
  DB.campaigns=(data||[]).map(r=>toLocal(r,by[r.id]||[]));
 }
 async function create(d){
  const u=me();if(!u)throw'Inicia sesión para crear una campaña.';
  const c=API.buildCampaign(d);
  let image_url=null;try{image_url=await Cloud.up(c.img,'camp')||null;}catch(e){console.warn(e);}
  const row={owner_id:u,type:c.type,name:c.name.trim(),description:c.desc,kind:c.kind,category:(catById(c.cat)||{}).name||null,place:c.place||null,latitude:c.place?c.lat:null,longitude:c.place?c.lng:null,max_participants:c.max||null,goal:c.goal||null,beneficiary:c.ben||null,address_to:c.addr||null,items:c.items?c.items.map(i=>({n:i.n,goal:i.goal})):null,date_options:c.opts.length?c.opts.map(o=>({id:o.id,label:o.label,dt:o.dt})):null,starts_at:iso(c.when),ends_at:iso(c.until),days:c.days||null,link:c.link||null,image_url,phase:c.status.toLowerCase(),moderation_status:isAdmin()?'approved':'pending'};
  const {data,error}=await sb().from(T).insert(row).select().single();
  if(error)throw error;
  const n=toLocal(data,[]);DB.campaigns.unshift(n);save();return n;
 }
 async function review(id,status,note){
  if(!isAdmin())return toast('Solo el equipo de administración puede revisar campañas.','err');
  const {error}=await sb().rpc('econova_review_campaign',{p_id:id,p_status:status,p_note:note||null});
  if(error)return toast(err(error),'err');
  const c=campById(id);if(c){c.mod=status;c.modNote=note||'';save();}
  toast(status==='approved'?'Campaña aprobada: ya es pública.':'Campaña rechazada.','ok');render();
 }
 async function remove(id){
  const {data,error}=await sb().from(T).delete().eq('id',id).select('id');
  if(error){toast(err(error),'err');return false;}
  if(!data||!data.length){toast('No se pudo eliminar: no tienes permiso o ya no existe.','err');return false;}
  return true;
 }
 async function persistResult(c){
  if(!enabled()||!UUID.test(c.id))return;
  const {error}=await sb().from(T).update({phase:'completed',result:c.result,updated_at:new Date().toISOString()}).eq('id',c.id);
  if(error)fail(error,'No se guardaron los resultados');
 }
 function fail(e,m){console.error('[EcoNova] campañas',e);toast(m+': '+err(e),'err');load().then(()=>render());}
 const orig={};['vote','closeVoting','join','checkin','pledge'].forEach(k=>{orig[k]=API[k];});
 const ok=cid=>enabled()&&me()&&UUID.test(cid);
 const ins=(row,m)=>sb().from(A).insert(row).then(({error})=>{if(error&&error.code!=='23505')fail(error,m);});
 API.vote=function(cid,oid){orig.vote.call(API,cid,oid);if(!ok(cid))return;
  sb().from(A).delete().eq('campaign_id',cid).eq('user_id',me()).eq('kind','vote').then(()=>ins({campaign_id:cid,user_id:me(),kind:'vote',option_id:oid},'No se guardó tu voto'));};
 API.closeVoting=function(cid){orig.closeVoting.call(API,cid);if(!ok(cid))return;const c=campById(cid);
  sb().from(T).update({phase:'scheduled',selected_option:c.selected,updated_at:new Date().toISOString()}).eq('id',cid).then(({error})=>{if(error)fail(error,'No se confirmó la fecha');});};
 API.join=function(cid){orig.join.call(API,cid);if(!ok(cid))return;ins({campaign_id:cid,user_id:me(),kind:'member'},'No se guardó tu registro');};
 API.checkin=function(cid){orig.checkin.call(API,cid);if(!ok(cid))return;
  const day=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);ins({campaign_id:cid,user_id:me(),kind:'checkin',day},'No se guardó tu avance');};
 API.pledge=function(cid,idx,qty){orig.pledge.call(API,cid,idx,qty);if(!ok(cid))return;ins({campaign_id:cid,user_id:me(),kind:'pledge',item_idx:+idx,qty:+qty},'No se guardó tu aporte');};
 return{load,create,review,remove,persistResult,err};
})();

/* ═════════ EcoNova · Mapa ambiental unificado (problemas + lugares) ═════════ */
var MapX=(()=>{
 const sb=()=>supabaseClient,enabled=()=>Supabase.enabled();
 const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-/i;
 const PROB=[['tala','Tala ilegal','🪓','#8a5a2b'],['incendio','Incendio o quema','🔥','#d9480f'],['tiradero','Tiradero o basura clandestina','🗑️','#7a6a4f'],['agua','Contaminación del agua','💧','#1c7ed6'],['aire','Contaminación del aire','🏭','#6c757d'],['animal','Maltrato o tráfico de animales','🐾','#c2255c'],['derrame','Derrame o fuga','🛢️','#343a40'],['otro_p','Otro problema ambiental','⚠️','#e03131']];
 const PLAC=[['reciclaje','Centro de reciclaje o acopio','♻️','#2f9e44'],['tienda','Tienda ecológica o a granel','🛍️','#0ca678'],['cosmeticos','Cosméticos naturales / sin crueldad animal','🧴','#ae3ec9'],['vivero','Vivero o reforestación','🌱','#40c057'],['ong','Organización ambiental','🤝','#1971c2'],['negocio','Negocio sostenible','🏪','#f08c00'],['energia','Composta o energía limpia','☀️','#f59f00'],['otro_l','Otro lugar ambiental','📍','#0e5c3e']];
 const CATS=[...PROB.map(c=>({k:'problem',id:c[0],l:c[1],e:c[2],c:c[3]})),...PLAC.map(c=>({k:'place',id:c[0],l:c[1],e:c[2],c:c[3]}))];
 const cat=id=>CATS.find(x=>x.id===id)||{k:'place',id,l:id,e:'📍',c:'#0e5c3e'};
 const KEY='econova_myloc',STL={pending:'En revisión',rejected:'Rechazado',resolved:'Resuelto',approved:'Publicado'};
 let pts=[],loaded=false,loading=false,map=null,layer=null,mine=null,radius=5,fKind='all',fCat='',pickCb=null,draft=null;
 try{mine=JSON.parse(store.get(KEY)||'null');}catch(e){mine=null;}
 const staff=()=>typeof isAdmin==='function'&&isAdmin();
 const uid=()=>{const u=sess();return u&&UUID.test(u.id)?u.id:null;};
 const rad=x=>x*Math.PI/180;
 const dist=(a,b)=>{const dLa=rad(b.lat-a.lat),dLo=rad(b.lng-a.lng),h=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;return 12742*Math.asin(Math.sqrt(h));};
 const km=k=>k<1?Math.round(k*1000)+' m':(k<10?k.toFixed(1):Math.round(k))+' km';
 const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const isAndroid=()=>/Android/i.test(navigator.userAgent);
 const gUrl=p=>`https://www.google.com/maps/dir/?api=1&destination=${p.latitude},${p.longitude}`;
 const navUrl=p=>{const n=encodeURIComponent(p.title||'Destino');if(isIOS())return`https://maps.apple.com/?daddr=${p.latitude},${p.longitude}&q=${n}`;if(isAndroid())return`geo:${p.latitude},${p.longitude}?q=${p.latitude},${p.longitude}(${n})`;return gUrl(p);};
 const web=u=>{u=String(u||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;return/^https?:\/\/[^\s]+\.[^\s]+$/i.test(u)?u:'';};
 const tel=t=>String(t||'').replace(/[^0-9+()\s-]/g,'').trim();
 const own=p=>p.owner_id===uid();
 const shown=p=>p.status==='approved'||p.status==='resolved'||(p.status==='pending'&&(own(p)||staff()));

 const $$=id=>document.getElementById(id);

 const errMsg=e=>e&&(e.code==='42P01'||/map_points/.test(e.message||''))?'Falta crear la tabla del mapa en Supabase.':((e&&e.message)||String(e));

 async function load(){

 function view(){

  <div class="page-head" style="padding-top:6px"><h1>Lo que pasa en tu zona</h1><span class="mx-kick">Mapa ambiental</span></div>

  <div class="mx-find"><input id="mx-q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Escribe tu colonia, ciudad o dirección"><button class="mx-go" data-mx="geo">Buscar</button></div>

 }
 function init(){

  load().then(()=>{if($$('bigmap')===el){draw();zone();if(!mine){const ll=pts.filter(passes).map(p=>[p.latitude,p.longitude]);if(ll.length)map.fitBounds(ll,{padding:[40,40],maxZoom:12});}}});
 }
 function popup(p){
  const c=cat(p.category),d=mine?dist(mine,{lat:p.latitude,lng:p.longitude}):null,w=web(p.website),t=tel(p.phone);
  const st=p.status!=='approved'?`<div class="mx-st">${STL[p.status]||p.status}</div>`:'';

  return`<div class="pop mx-pop">${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:''}<span class="mx-tag" style="--c:${c.c}">${c.e} ${esc(c.l)}</span><h4>${esc(p.title)}</h4>${st}${p.description?`<p class="sm">${esc(p.description)}</p>`:''}${p.address?`<div class="sm mut">📍 ${esc(p.address)}</div>`:''}${t?`<div class="sm"><a href="tel:${esc(t)}">📞 ${esc(t)}</a></div>`:''}${w?`<div class="sm"><a href="${esc(w)}" target="_blank" rel="noopener">🔗 Sitio web</a></div>`:''}${d!=null?`<div class="sm mut">A ${km(d)} de ti</div>`:''}<a class="btn btn-green btn-sm mx-go" href="${esc(navUrl(p))}" target="_blank" rel="noopener">🧭 Abrir en mi app de mapas</a><a class="mx-alt" href="${esc(gUrl(p))}" target="_blank" rel="noopener">Ver en Google Maps</a>${p.kind==='problem'?'<div class="xs mut" style="margin-top:6px">EcoNova no sustituye al 911, PROFEPA ni a Protección Civil.</div>':''}${sf}</div>`;
 }
 function draw(){
  if(!map||!layer)return;layer.clearLayers();
  if(mine){L.circle([mine.lat,mine.lng],{radius:radius*1000,color:'#1c7ed6',weight:1,fillColor:'#1c7ed6',fillOpacity:.06}).addTo(layer);L.circleMarker([mine.lat,mine.lng],{radius:8,color:'#fff',weight:3,fillColor:'#1c7ed6',fillOpacity:1}).addTo(layer).bindTooltip('Tu ubicación');}

 function zone(){

  ${near.slice(0,8).map(x=>{const c=cat(x.p.category);return`<div class="mx-item"><span class="mx-emoji" style="--c:${c.c}">${c.e}</span><div style="flex:1;min-width:0"><b class="mx-t">${esc(x.p.title)}</b><div class="xs mut">${esc(c.l)} · ${km(x.d)}${x.p.status==='resolved'?' · resuelto':''}</div></div><button class="btn btn-ghost btn-sm" data-mx="fly" data-id="${x.p.id}">Ver</button><a class="btn btn-ghost btn-sm" href="${esc(navUrl(x.p))}" target="_blank" rel="noopener">🧭</a></div>`;}).join('')||'<p class="sm mut" style="margin-top:10px">Todavía no hay puntos aprobados en esta zona. ¡Sé la primera persona en añadir uno!</p>'}

 }
 function setMine(lat,lng,src){mine={lat,lng,src};store.set(KEY,JSON.stringify(mine));draw();zone();if(map)map.flyTo([lat,lng],13);}
 const getPos=()=>new Promise((ok,no)=>{if(!navigator.geolocation)return no('Tu navegador no permite obtener la ubicación.');navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude}),e=>no(e.code===1?'No diste permiso de ubicación. Puedes escribir tu colonia o tocar el mapa.':'No se pudo obtener tu ubicación. Intenta de nuevo o escribe tu colonia.'),{enableHighAccuracy:true,timeout:12000,maximumAge:60000});});
 async function geocode(q){q=String(q||'').trim();if(q.length<3)throw'Escribe al menos 3 letras.';let r;try{r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=es&q='+encodeURIComponent(q));}catch(e){throw'No se pudo buscar esa dirección. Revisa tu conexión.';}
  if(!r.ok)throw'No se pudo buscar esa dirección ahora.';const j=await r.json();if(!j.length)throw'No encontré ese lugar. Prueba con colonia y ciudad.';return{lat:+j[0].lat,lng:+j[0].lon,name:j[0].display_name};}

 /* ── formulario para añadir ── */
 const val=id=>{const e=$$(id);return e?e.value:null;};
 function syncDraft(){if(!draft)return;const m={category:'mx-f-cat',title:'mx-f-title',description:'mx-f-desc',address:'mx-f-addr',phone:'mx-f-tel',website:'mx-f-web'};for(const k in m){const v=val(m[k]);if(v!==null)draft[k]=v;}}
 function openForm(kind,resume){
  if(!uid()){if(!sess())return guard();return toast('Necesitas una cuenta conectada para añadir puntos.','err');}
  if(!resume||!draft)draft={kind:kind||'place',category:'',title:'',description:'',address:'',phone:'',website:'',lat:null,lng:null,img:''};
  else if(kind)draft.kind=kind;
  renderForm();
 }
 function renderForm(){
  const d=draft,list=d.kind==='problem'?PROB:PLAC;
  modal(`<h3>Añadir al mapa</h3><p class="sm mut mb2">Un moderador revisará tu propuesta antes de mostrarla a la comunidad.</p>
  <div class="mx-seg"><button type="button" class="${d.kind==='place'?'on':''}" data-mx="fkind" data-v="place">🏪 Lugar</button><button type="button" class="${d.kind==='problem'?'on':''}" data-mx="fkind" data-v="problem">⚠️ Problema</button></div>
  <div class="field"><label>${d.kind==='problem'?'Tipo de problema':'Tipo de lugar'}</label><select id="mx-f-cat"><option value="">Selecciona…</option>${list.map(c=>`<option value="${c[0]}" ${d.category===c[0]?'selected':''}>${c[2]} ${c[1]}</option>`).join('')}</select></div>
  <div class="field"><label>${d.kind==='problem'?'Título del problema':'Nombre del lugar'}</label><input id="mx-f-title" maxlength="120" value="${esc(d.title)}"></div>
  <div class="field"><label>Descripción</label><textarea id="mx-f-desc" maxlength="1000" placeholder="${d.kind==='problem'?'Qué está pasando, desde cuándo y cómo se ve. No incluyas datos personales.':'Qué ofrece y por qué es ambientalmente responsable.'}">${esc(d.description)}</textarea></div>
  <div class="field"><label>Dirección o referencia</label><input id="mx-f-addr" maxlength="200" value="${esc(d.address)}"></div>
  ${d.kind==='place'?`<div class="field"><label>Teléfono (opcional)</label><input id="mx-f-tel" type="tel" maxlength="30" value="${esc(d.phone)}"></div><div class="field"><label>Sitio web (opcional)</label><input id="mx-f-web" maxlength="200" value="${esc(d.website)}"></div>`:''}
  <div class="field"><label>Foto (opcional)</label><input type="file" accept="image/*" data-mximg="1"><div id="mx-f-prev">${d.img?`<img src="${d.img}" alt="" style="max-height:110px;border-radius:8px;margin-top:8px">`:''}</div></div>
  <div class="field"><label>Ubicación</label><div class="sm" id="mx-f-loc">${d.lat!=null?`✅ ${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}`:'Aún sin ubicación'}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button type="button" class="btn btn-ghost btn-sm" data-mx="floc">📍 Usar mi ubicación</button>${$$('bigmap')?'<button type="button" class="btn btn-ghost btn-sm" data-mx="fpick">Marcar en el mapa</button>':''}</div>
   <div style="display:flex;gap:8px;margin-top:8px"><input id="mx-f-q" style="flex:1;min-width:0" placeholder="Buscar dirección…"><button type="button" class="btn btn-ghost btn-sm" data-mx="fgeo">Buscar</button></div></div>
  ${d.kind==='problem'?'<div class="mx-warn"><b>Tu seguridad primero.</b> EcoNova no sustituye a los servicios de emergencia: si hay riesgo inmediato (incendio, derrame), llama al 911. Para denuncias formales acude a PROFEPA o Protección Civil. No te expongas ni confrontes a nadie.</div>':''}
  <button type="button" class="btn btn-green btn-block" data-mx="save">Enviar a revisión</button>`);
 }
 async function save(el){
  syncDraft();const d=draft,u=uid();if(!u)return guard();
  if(!d.category)return toast('Elige el tipo.','err');
  if(String(d.title).trim().length<3)return toast('Escribe un nombre o título.','err');
  if(d.lat==null)return toast('Falta la ubicación: úsala, márcala en el mapa o búscala por dirección.','err');
  el.disabled=true;
  try{
   let image_url=null;if(d.img){try{image_url=await Cloud.up(d.img,'map');}catch(e){console.warn(e);}}
   const row={owner_id:u,kind:d.kind,category:d.category,title:d.title.trim(),description:String(d.description).trim()||null,address:String(d.address).trim()||null,latitude:d.lat,longitude:d.lng,website:web(d.website)||null,phone:tel(d.phone)||null,image_url,status:staff()?'approved':'pending'};
   const {data,error}=await sb().from('map_points').insert(row).select().single();
   if(error)throw error;
   pts.unshift(data);draft=null;closeModal();draw();zone();if(map)map.flyTo([data.latitude,data.longitude],15);
   toast(staff()?'Publicado en el mapa.':'¡Gracias! Un moderador revisará tu propuesta.','ok');
  }catch(e){console.error(e);toast(errMsg(e),'err');el.disabled=false;}
 }
 /* ── moderación ── */
 async function setStatus(id,status,note){
  if(!staff())return toast('Solo el equipo de moderación puede hacer esto.','err');
  const {data,error}=await sb().from('map_points').update({status,moderator_note:note||null,reviewed_by:uid(),reviewed_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id).select().single();
  if(error)return toast(errMsg(error),'err');
  const i=pts.findIndex(x=>x.id===id);if(i>=0)pts[i]=data;draw();zone();refreshAdmin();
  toast({approved:'Aprobado: ya se ve en el mapa.',rejected:'Propuesta rechazada.',resolved:'Marcado como resuelto.'}[status]||'Actualizado.','ok');
  if(map&&map.closePopup)map.closePopup();
 }
 async function remove(id){
  if(!staff())return;if(!confirm('¿Eliminar este punto del mapa? No se puede deshacer.'))return;
  const {error}=await sb().from('map_points').delete().eq('id',id);if(error)return toast(errMsg(error),'err');
  pts=pts.filter(x=>x.id!==id);draw();zone();refreshAdmin();toast('Eliminado.','ok');
 }
 function pendingCount(){if(!loaded&&!loading&&enabled()){loading=true;load().then(()=>{loading=false;if(location.hash==='#/admin')render();});}return pts.filter(p=>p.status==='pending').length;}
 function adminInner(){
  const pend=pts.filter(p=>p.status==='pending'),rest=pts.filter(p=>p.status!=='pending').slice(0,40);
  const row=p=>{const c=cat(p.category),o=userById(p.owner_id);return`<div class="card pad mt1 mx-arow"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="mx-tag" style="--c:${c.c}">${c.e} ${esc(c.l)}</span><span class="badge">${p.kind==='problem'?'Problema':'Lugar'}</span><span class="badge">${STL[p.status]||p.status}</span></div>
   <h4 style="margin:8px 0 2px">${esc(p.title)}</h4><div class="xs mut">Por ${esc(o.name)} · ${timeAgo(Date.parse(p.created_at))}</div>
   ${p.description?`<p class="sm" style="margin:6px 0">${esc(p.description)}</p>`:''}${p.address?`<div class="sm mut">📍 ${esc(p.address)}</div>`:''}${p.image_url?`<img src="${esc(p.image_url)}" alt="" style="max-height:120px;border-radius:8px;margin-top:8px">`:''}
   <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${p.status!=='approved'&&p.status!=='resolved'?`<button class="btn btn-green btn-sm" data-mx="approve" data-id="${p.id}">Aprobar</button>`:''}${p.status==='pending'?`<button class="btn btn-danger btn-sm" data-mx="reject" data-id="${p.id}">Rechazar</button>`:''}${p.status==='approved'&&p.kind==='problem'?`<button class="btn btn-ghost btn-sm" data-mx="resolve" data-id="${p.id}">Marcar resuelto</button>`:''}${p.status==='resolved'?`<button class="btn btn-ghost btn-sm" data-mx="reopen" data-id="${p.id}">Reabrir</button>`:''}<a class="btn btn-ghost btn-sm" href="${esc(navUrl(p))}" target="_blank" rel="noopener">🧭 Ver ubicación</a><button class="btn btn-ghost btn-sm" data-mx="remove" data-id="${p.id}">Eliminar</button></div></div>`;};
  return`<h3 style="margin-top:14px">Pendientes de revisión (${pend.length})</h3>${pend.map(row).join('')||'<p class="mut">No hay propuestas pendientes.</p>'}<h3 style="margin-top:22px">Últimos movimientos</h3>${rest.map(row).join('')||'<p class="mut">Sin movimientos.</p>'}`;
 }
 function refreshAdmin(){const b=$$('mx-admin');if(b)b.innerHTML=adminInner();}
 function adminHTML(){pendingCount();return`<div id="mx-admin">${adminInner()}</div>`;}

 /* ── eventos ── */
 const H={
  async locate(){try{const p=await getPos();setMine(p.lat,p.lng,'gps');toast('Ubicación activada. Solo tú la ves.','ok');}catch(e){toast(String(e),'err');}},
  pickme(){pickCb=ll=>{setMine(ll.lat,ll.lng,'manual');toast('Ubicación guardada.','ok');};hint('Toca el mapa para marcar tu ubicación');$$('bigmap')&&$$('bigmap').scrollIntoView({behavior:'smooth',block:'center'});},
  add(){openForm(null,false);},
  async geo(){try{const r=await geocode(val('mx-q'));setMine(r.lat,r.lng,'manual');toast('Zona encontrada.','ok');}catch(e){toast(String(e),'err');}},
  kind(el){fKind=el.dataset.v;fCat='';const f=$$('mx-filters');if(f)f.innerHTML=chips();draw();zone();},
  fly(el){const p=pts.find(x=>x.id===el.dataset.id);if(!p||!map)return;$$('bigmap').scrollIntoView({behavior:'smooth',block:'center'});map.flyTo([p.latitude,p.longitude],16);},
  clearloc(){mine=null;store.del(KEY);draw();zone();},
  fkind(el){syncDraft();draft.kind=el.dataset.v;draft.category='';renderForm();},
  async floc(){syncDraft();try{const p=mine||await getPos();draft.lat=p.lat;draft.lng=p.lng;renderForm();}catch(e){toast(String(e),'err');}},
  fpick(){syncDraft();closeModal();hint('Toca el mapa para colocar el punto');pickCb=ll=>{draft.lat=ll.lat;draft.lng=ll.lng;openForm(null,true);};$$('bigmap')&&$$('bigmap').scrollIntoView({behavior:'smooth',block:'center'});},
  async fgeo(){syncDraft();try{const r=await geocode(val('mx-f-q'));draft.lat=r.lat;draft.lng=r.lng;if(!String(draft.address).trim())draft.address=r.name.split(',').slice(0,3).join(',');renderForm();}catch(e){toast(String(e),'err');}},
  save(el){save(el);},
  approve(el){setStatus(el.dataset.id,'approved');},
  reject(el){const n=prompt('Motivo del rechazo (opcional):');if(n===null)return;setStatus(el.dataset.id,'rejected',n);},
  resolve(el){setStatus(el.dataset.id,'resolved');},
  reopen(el){setStatus(el.dataset.id,'approved');},
  remove(el){remove(el.dataset.id);}
 };
 document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-mx]');if(!el)return;e.preventDefault();const f=H[el.dataset.mx];if(f)f(el);},true);
 document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.mxsel==='cat'){fCat=t.value;draw();}
  else if(t.dataset&&t.dataset.mxsel==='radius'){radius=+t.value;draw();zone();}
  else if(t.dataset&&t.dataset.mximg){const fl=t.files&&t.files[0];t.value='';if(!fl||!draft)return;if(!fl.type.startsWith('image/'))return toast('Selecciona una imagen.','err');if(fl.size>8*1024*1024)return toast('Imagen muy grande (máx. 8 MB).','err');
   compress(fl).then(d=>{draft.img=d;const pv=$$('mx-f-prev');if(pv)pv.innerHTML=`<img src="${d}" alt="" style="max-height:110px;border-radius:8px;margin-top:8px">`;}).catch(()=>toast('No se pudo leer la imagen.','err'));}
 },true);
 document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='mx-q'){e.preventDefault();H.geo();}else if(e.target.id==='mx-f-q'){e.preventDefault();H.fgeo();}});
 return{view,init,openForm,adminHTML,pendingCount,load};
})();
</script>

 ['como estas|como te va|como andas|como te sientes|que tal estas|todo bien','¡Muy bien, gracias por preguntar! 🌿 Siempre con energía verde. ¿En qué te ayudo?','feliz'],
 ['hola|buenas|buenos|saludos|que tal|hey|buen dia','¡Hola! 🌱 Soy <b>Eco</b>. Puedo orientarte en la app, explicarte cómo reportar, publicar o unirte a campañas, y darte consejos ecológicos.','feliz'],
 ['gracias|genial|perfecto|excelente','¡Con mucho gusto! Para eso estoy 💚','guino'],
 ['adios|chao|nos vemos|hasta luego|hasta pronto|bye','¡Hasta pronto! Cuida el planeta, yo cuido la app 🌍','guino'],
 ['quien hizo|quien creo|quien desarrollo|quien lo hizo|quien programo|creador|fundador|desarrollador','EcoNova fue creada y desarrollada por <b>Ángel Alberto Guzmán Martínez</b>, fundador del proyecto.','feliz'],
 ['quien eres|como te llamas|tu nombre|eres un|eres una|eres real|que eres|eres humano|eres robot','Soy <b>Eco</b>, la mascota de EcoNova: tu aliado en un mundo más verde. Todavía soy un asistente sencillo, pero aprendo rápido 😊','feliz'],
 ['ayud|que puedes|que sabes|como funciona|opciones|menu|que haces|para que sirves','Puedo ayudarte con: <b>reportar problemas</b>, el <b>mapa</b>, <b>campañas</b>, <b>publicar</b>, <b>donar</b>, tu <b>cuenta</b> y <b>consejos ecológicos</b> (reciclaje, agua, energía, composta). También puedo llevarte a cualquier sección: pídeme “llévame al mapa”.','emocionado'],
 ['que es econova|para que sirve econova|de que trata|econova es|acerca de','<b>EcoNova</b> es una red social ambiental que convierte la interacción digital en acciones reales: reportar problemas, informarte, organizar campañas, sumarte como voluntario, donar y medir el impacto.','feliz'],
 ['reportar publicacion|denunciar publicacion|reportar comentario|denunciar comentario|reportar un usuario|denunciar a|contenido ofensivo|spam|informacion falsa','Abre el menú de opciones de la publicación (<b>Opciones</b>) y elige <b>Denunciar</b> con el motivo. El equipo de EcoNova revisará la denuncia.','curioso'],
 ['category|categori','Al crear una publicación, toca el selector <b>Categoría</b> y elige la que mejor la describa; están agrupadas por tema.','feliz'],
 ['public|subir|subo|postear|compartir|crear post','Toca el botón <b>+</b> para crear una publicación: título, descripción, categoría, ubicación (opcional) y fotos. Antes de mostrarse, un moderador la revisa (pendiente → aprobada o rechazada).','feliz','#/estado-publicaciones','Estado de mis publicaciones'],
 ['pendient|aprob|moderad|moderacion|rechaz|no aparece|no se ve|revision','Todas las publicaciones pasan por moderación. Verás su estado como <b>pendiente</b>, <b>aprobada</b> o <b>rechazada</b>. Si fue rechazada, suele indicarse el motivo.','curioso','#/estado-publicaciones','Ver estado'],
 ['report|denunci|tala|basura|contamin|quema|fuga|problema ambiental|incendio','Para reportar un problema ambiental usa el <b>Mapa</b>: marca el punto, elige la categoría y agrega una foto; un moderador lo revisa. ⚠️ Si es una urgencia, llama al <b>911</b>, a <b>PROFEPA</b> o a <b>Protección Civil</b>: EcoNova no sustituye a los servicios de emergencia.','curioso','#/mapa','Ir al mapa'],
 ['mapa|lugar|ubicacion|centro de acopio|acopio|donde reciclar|donde reciclo|puntos de reciclaje|punto de reciclaje|cerca de mi','En el <b>Mapa</b> ves lugares (reciclaje, tiendas eco, centros ambientales) y problemas reportados. Puedes usar tu ubicación (GPS o manual) y proponer puntos nuevos; un moderador los aprueba. Cada punto se abre en la app de mapas de tu teléfono.','feliz','#/mapa','Abrir el mapa'],
 ['campan|volunt|evento|organizar|actividad|limpieza','En <b>Campañas</b> puedes sumarte como voluntario o crear una. La fecha se decide con una votación entre los participantes.','emocionado','#/campanas','Ver campañas'],
 ['donar|donacion|donativ|donando|dono|apoyar|apoyo|aportar|aporte|dinero|transparencia|fondo','En <b>Donar</b> puedes apoyar causas ambientales, y en <b>Transparencia</b> puedes ver cómo se usan los recursos. ¡Gracias por pensar en ello! 💚','emocionado','#/donar','Ir a Donar'],
 ['aprender|tips|tip|consejo|curso|guia|educacion|como ayudo|que puedo hacer','En <b>Aprender</b> hay guías y consejos. Y aquí van tres básicos: separa tus residuos, evita plásticos de un solo uso y apaga lo que no uses 🌿','guino','#/aprender','Ir a Aprender'],
 ['busc|encontrar|explorar','Usa la barra de búsqueda de arriba o abre <b>Explorar</b> para encontrar publicaciones, personas y #hashtags.','feliz','#/explorar','Abrir Explorar'],
 ['organizacion|empresa|ong|colectivo|negocio|tipos de cuenta|tipo de cuenta|ciudadano','EcoNova tiene tipos de cuenta: <b>ciudadano</b>, <b>organización</b> y <b>empresa</b>. Puedes ver a las organizaciones en su sección.','curioso','#/organizaciones','Ver organizaciones'],
 ['contrasena|olvide|recuperar|restablecer|clave|password','En la pantalla de inicio de sesión toca <b>“¿Olvidaste tu contraseña?”</b> y recibirás un enlace por correo para crear una nueva.','curioso'],
 ['crear cuenta|crear una cuenta|creo una cuenta|creo mi cuenta|crear mi cuenta|abrir cuenta|nueva cuenta|registr|unirme|inscrib|verific|confirmar correo|no me llega|codigo','Toca <b>“Crear cuenta”</b>, elige tu tipo de cuenta y confirma tu correo. Si no te llega, revisa spam/no deseado.','feliz'],
 ['perfil|foto de perfil|mi nombre|editar|configurac|ajustes|cambiar foto|biografia','Tu perfil y tus ajustes están en tu cuenta (arriba a la derecha). Ahí puedes editar tus datos y preferencias.','feliz','#/configuracion','Ir a Configuración'],
 ['guardad|guardar|favorit','Tus publicaciones guardadas están en <b>Guardados</b>.','feliz','#/guardados','Ver guardados'],

 var ROUTES=[['mapa','#/mapa'],['campana','#/campanas'],['aprender','#/aprender'],['donar','#/donar'],['transparencia','#/transparencia'],['organizacion','#/organizaciones'],['guardado','#/guardados'],['notificacion','#/notificaciones'],['configuracion','#/configuracion'],['logro','#/logros'],['perfil','#/perfil'],['inicio','#/'],['explorar','#/explorar']];
 function norm(s){return ' '+String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
 function kmatch(n,ws,k){
  if(k.indexOf(' ')>=0)return n.indexOf(' '+k)>=0;
  var ex=k.charAt(0)==='=';if(ex)k=k.slice(1);
  for(var i=0;i<ws.length;i++){var w=ws[i];if((ex||k.length<4)?w===k:w.indexOf(k)===0)return true}
  return false;

 function near(a,b){var la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;var i=0,j=0,e=0;while(i<la&&j<lb){if(a.charAt(i)===b.charAt(j)){i++;j++;continue}if(++e>1)return false;if(la>lb)i++;else if(lb>la)j++;else{i++;j++}}return e+(la-i)+(lb-j)<=1}
 function brain(q){
  var n=norm(q),ws=n.trim().split(' '),best=null,bs=0,nav=/ (llevame|llevarme|llevar|abre|abreme|abrir|ir a|ve a|muestrame|quiero ver|ensename|dirigeme)/.test(n);

  KB.forEach(function(e){var s=0;e[0].split('|').forEach(function(k){if(kmatch(n,ws,k))s+=k.replace('=','').length});if(s>bs){bs=s;best=e}});
  if(bs<3){ /* sin coincidencia clara: tolera errores de tipeo de 1 letra ('reportr', 'reciclje') */
   best=null;bs=0;
   KB.forEach(function(e){var s=0;e[0].split('|').forEach(function(k){if(k.charAt(0)==='='||k.indexOf(' ')>=0||k.length<6)return;for(var i=0;i<ws.length;i++){var w=ws[i];if(w.length>=5&&near(w.slice(0,k.length),k)){s+=k.length*.6;break}}});if(s>bs){bs=s;best=e}});
   if(bs<3.5)return null;
  }

 function placeChat(){

  var r=a.getBoundingClientRect(),w=Math.min(370,innerWidth-20),l=Math.max(10,Math.min(r.left+r.width/2-30,innerWidth-w-10));

 function openChat(){

   msg((n?'¡Hola, <b>'+n+'</b>! ':'¡Hola! ')+'Soy <b>Eco</b>, tu compañero en esta aventura por un planeta más limpio. ¿En qué te ayudo?','bot');chips(starters());}

 function eHtml(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

 function withTimeout(p,ms){return new Promise(function(ok,no){var t=setTimeout(function(){no(new Error('timeout'))},ms);p.then(function(v){clearTimeout(t);ok(v)},function(e){clearTimeout(t);no(e)})})}
 function ask(q){

   else{var c=[];if(r.go&&user()&&!r.auto)c.push({t:r.lbl||'Ir allí',go:r.go});chips(c);}

<script id="econova-splash-js">
/* ═════════ EcoNova · Splash: las piezas del logo se atraen al centro, laten una vez y dan paso al login ═════════ */

    a0:rnd(0,Math.PI*2),w:rnd(.12,.34)*(Math.random()<.5?-1:1),d:rnd(80,480),dur:rnd(950,1250),

  }

  }

   if(d<maxD){ctx.strokeStyle='rgba(91,208,142,'+((1-d/maxD)*.16*env*Math.min(p.e,q.e)).toFixed(3)+')';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}
  }}
  for(i=0;i<P.length;i++){
   p=P[i];var a=p.al*env;
   ctx.fillStyle='rgba('+p.c+','+(a*.12).toFixed(3)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r*3.2,0,6.283);ctx.fill();
   ctx.fillStyle='rgba('+p.c+','+a.toFixed(3)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
  }
 }
 function frame(now){if(done)return;draw(now-t0);requestAnimationFrame(frame);}

 function formed(){
  if(formedDone)return;formedDone=true;
  var full=mark.querySelector('.es-full');if(full)full.style.opacity=1;
  wedges.forEach(function(w){w.el.getAnimations().forEach(function(a){a.cancel()});w.el.style.visibility='hidden'});
  letters.forEach(function(l){l.getAnimations().forEach(function(a){a.cancel()})});

   logo.animate([{transform:'scale(1)'},{transform:'scale(1.055)',offset:.28},{transform:'scale(.992)',offset:.5},{transform:'scale(1.022)',offset:.68},{transform:'scale(1)'}],{duration:720,easing:'ease-in-out'});

  }
 }

 function exit(){
  if(exiting)return;formed();exiting=true;tExit=performance.now()-t0;

  logo.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.9)'}],{duration:560,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});

 }

 function start(){

  build();
  if(reduce){
   mark.querySelector('.es-full').style.opacity=1;
   logo.animate([{opacity:0},{opacity:1}],{duration:450,fill:'both'});
   t0=performance.now();setTimeout(exit,1100);return;
  }
  var D=Math.max(W,H),i;
  wedges.forEach(function(w,i){fly(w.el,w.ang+rnd(-.2,.2),D*rnd(.36,.56),T_START+i*38+rnd(0,40),820,16,1.25)});

  initParticles();t0=performance.now();requestAnimationFrame(frame);
  setTimeout(formed,T_FORM);setTimeout(exit,T_EXIT);
 }

 root.addEventListener('pointerdown',function(){if(t0)exit()}); /* toque = saltar */
 var img=new Image();img.src=src;
 Promise.race([
  Promise.all([img.decode?img.decode().catch(function(){}):0,(document.fonts&&document.fonts.load)?document.fonts.load('800 60px Sora','EcoNova').catch(function(){}):0]),
  sleep(700)

 }catch(err){console.warn('Splash EcoNova:',err);cleanup();}

<script id="econova-refresh-feed">
(function(){
 let busy=false,startY=0,pullActive=false,pullDistance=0;
 const isHome=()=>((location.hash||'#/')==='#/'||location.hash===''||location.hash==='#');
 const indicator=()=>document.getElementById('feed-refresh-indicator');
 async function refreshFeed(showMessage=true){
  if(busy)return;
  busy=true;
  const el=indicator();
  if(el){el.classList.remove('is-pulling');el.classList.add('is-refreshing');el.innerHTML='<span class="feed-refresh-mark">↻</span><span>Actualizando EcoNova…</span>';}
  try{
   if(typeof Supabase!=='undefined'&&Supabase.enabled()&&typeof Cloud!=='undefined'&&typeof Cloud.sync==='function'){
    await Cloud.sync();
   }
   if(window.EcoFeedReset)EcoFeedReset();
   if(isHome())render();
   if(showMessage&&typeof toast==='function')toast('Inicio actualizado.','ok');
  }catch(err){
   console.error('[EcoNova] No se pudo actualizar el feed:',err);
   if(showMessage&&typeof toast==='function')toast('No se pudo actualizar. Revisa tu conexión e inténtalo otra vez.','err');
  }finally{
   busy=false;
   const current=indicator();
   if(current){current.classList.remove('is-refreshing','is-pulling');current.innerHTML='<span class="feed-refresh-mark">↻</span><span>Desliza hacia abajo para actualizar</span>';}
  }
 }
 window.EcoNovaRefreshFeed=refreshFeed;
 // Al tocar la casita/logo estando ya en Inicio, actualizar sin depender del hashchange.
 document.addEventListener('click',function(e){
  if(e.target.closest&&e.target.closest('.eav,#eav-chat,#eav-bub'))return; // Eco vive dentro del logo: tocarlo NO debe refrescar
  const link=e.target.closest('#bottomnav a[href="#/"], .rail a[href="#/"], .brand[href="#/"]');
  if(!link||!isHome())return;
  e.preventDefault();refreshFeed(true);
 },true);
 // Pull-to-refresh para móvil/PWA: solo inicia cuando el feed está arriba del todo.
 window.addEventListener('touchstart',function(e){
  startY=0;pullActive=false;pullDistance=0;
  if(e.target&&e.target.closest&&e.target.closest('#eav-chat,#eav-bub,#eco-sheet,#eco-viewer,#modal.open,#eco-ach-pop,#eco-streak-sheet,#eco-streak-fab'))return; // deslizar dentro del chat de Eco / hojas no es "tirar para actualizar"
  if(!isHome()||window.scrollY>3||!e.touches||!e.touches.length)return;
  startY=e.touches[0].clientY;
 },{passive:true});
 window.addEventListener('touchmove',function(e){
  if(!startY||!isHome()||!e.touches||!e.touches.length)return;
  const dy=e.touches[0].clientY-startY;
  if(dy<0){pullActive=false;pullDistance=0;const el=indicator();if(el)el.classList.remove('is-pulling');return;}
  pullDistance=dy;
  if(dy>150){pullActive=true;const el=indicator();if(el){el.classList.add('is-pulling');el.classList.remove('is-refreshing');const span=el.querySelectorAll('span')[1];if(span)span.textContent=dy>=240?'Suelta para actualizar':'Desliza más para actualizar';}}
  if(dy>240&&e.cancelable)e.preventDefault();
 },{passive:false});
 window.addEventListener('touchend',function(){
  if(pullActive&&pullDistance>=240&&startY&&isHome()&&window.scrollY<=8)refreshFeed(true);
  startY=0;pullActive=false;pullDistance=0;
 },{passive:true});
 window.addEventListener('touchcancel',function(){startY=0;pullActive=false;pullDistance=0;const el=indicator();if(el)el.classList.remove('is-pulling');},{passive:true});
})();
</script>

<script id="econova-feed-live">
(function(){
 const F={loading:false,end:false,err:false,fresh:new Set(),ch:null,q:false};
 const isHome=()=>{const h=location.hash||'#/';return h==='#/'||h==='#';};
 const el=()=>document.getElementById('feed-more');
 function paint(){const e=el();if(!e)return;
  const h=F.loading?'<div style="width:100%">'+ecoSkel(2)+'</div>':F.err?'<span>No se pudieron cargar más publicaciones.</span><button class="btn btn-sm" data-feed-retry>Reintentar</button>':(F.end&&feedItems().length)?'<span>Has llegado al final.</span>':'';
  if(e.dataset.h!==h){e.dataset.h=h;e.innerHTML=h;}}
 async function more(){
  if(F.loading||F.err||!isHome()||typeof feedItems!=='function')return;
  const e=el(),list=document.querySelector('.feed-modern-list');
  if(!e||!list||e.getBoundingClientRect().top>innerHeight+600){paint();return;}
  let items=feedItems();
  if(items.length<=feedLimit&&!F.end){
   F.loading=true;paint();
   try{if(Supabase.enabled()&&Cloud.older){if(await Cloud.older()<20)F.end=true;}else F.end=true;}catch(x){console.error('[EcoNova] feed',x);F.err=true;}
   F.loading=false;items=feedItems();
  }
  const next=items.slice(feedLimit,feedLimit+FEED_PAGE);
  if(next.length&&isHome()&&el()===e){feedLimit+=next.length;list.insertAdjacentHTML('beforeend',next.map(postCard).join(''));}
  paint();
 }
 function pill(){let b=document.getElementById('feed-new');
  if(!F.fresh.size||!isHome()){if(b)b.remove();return;}
  if(!b){b=document.createElement('button');b.id='feed-new';b.className='feed-new';b.onclick=()=>{scrollTo({top:0});if(window.EcoNovaRefreshFeed)EcoNovaRefreshFeed(false);};document.body.appendChild(b);}
  const n=F.fresh.size;b.textContent=n===1?'Hay 1 publicación nueva':'Hay '+n+' publicaciones nuevas';}
 function live(){
  const on=isHome()&&typeof Supabase!=='undefined'&&Supabase.enabled()&&typeof sess==='function'&&sess();
  if(on&&!F.ch){F.ch=Supabase.subscribe('eco-feed-live','posts',pl=>{const r=pl&&pl.new,me=sess();
    if(!r||!me||r.status!=='approved'||r.shared_from||r.author_id===me.id)return;
    const ex=DB.posts.find(p=>p.id===r.id);if(ex&&ex.status==='APPROVED')return;
    F.fresh.add(r.id);pill();});}
  else if(!on&&F.ch){Supabase.removeSubscription(F.ch);F.ch=null;F.fresh.clear();pill();}
 }
 window.EcoFeedReset=function(){F.end=false;F.err=false;F.fresh.clear();feedLimit=FEED_PAGE;pill();};
 const tick=()=>{if(F.q)return;F.q=true;requestAnimationFrame(()=>{F.q=false;try{live();more();}catch(x){console.warn('[EcoNova] feed',x);}});};
 document.addEventListener('click',e=>{if(e.target.closest('[data-feed-retry]')){F.err=false;tick();}});
 addEventListener('scroll',tick,{passive:true});addEventListener('resize',tick,{passive:true});addEventListener('hashchange',tick);
 addEventListener('pagehide',()=>{if(F.ch){Supabase.removeSubscription(F.ch);F.ch=null;}});
 new MutationObserver(tick).observe(document.body,{childList:true,subtree:true});
 tick();
})();
</script>
