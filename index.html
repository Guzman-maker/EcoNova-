<script id="econova-v2-js">
/* ═════════ EcoNova v2 · lista de likes, menciones (@), editar publicaciones y reproductor ═════════ */
(function(){
'use strict';
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-/i;
/* Roles que pueden usar @todos. Para incluir también a moderadores: ['DEV','MOD'] (y en el SQL role in ('DEV','MODERATOR')). */
const ECO_ALL_ROLES=['DEV'];
const canMentionAll=()=>{const u=sess();return !!u&&ECO_ALL_ROLES.includes(u.role);};
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const rxEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const cloudOn=()=>typeof Supabase!=='undefined'&&Supabase.enabled()&&!!supabaseClient;
const realUser=()=>{const u=sess();return u&&UUID.test(u.id)?u:null;};
const SVG=(d,x)=>`<svg viewBox="0 0 24 24" ${x||'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'} aria-hidden="true">${d}</svg>`;
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.7-9.4-9C1.2 7.7 3.6 4 7 4c2 0 3.8 1.1 5 3 1.2-1.9 3-3 5-3 3.4 0 5.8 3.7 4.4 7-1.9 4.3-9.4 9-9.4 9z"/></svg>';
const VERIFIED='<span class="verify-badge" title="Cuenta verificada" aria-label="Cuenta verificada">✓</span>';

/* ───────────────────────── Menciones: análisis del texto ───────────────────────── */
let _mn={sig:'',src:'',map:null};
function mnIndex(){
 const us=DB.users.filter(u=>u&&u.id&&u.id!=='?'&&String(u.name||'').trim().length>=2);
 const sig=us.length+':'+us.reduce((a,u)=>a+String(u.name).length,0);
 if(_mn.sig===sig&&_mn.map)return _mn;
 const map=new Map();us.forEach(u=>{const k=String(u.name).trim().toLowerCase();if(!map.has(k))map.set(k,[]);map.get(k).push(u);});
 const keys=[...new Set(['todos',...map.keys()])].sort((a,b)=>b.length-a.length).map(rxEsc);
 _mn={sig,map,src:'(^|[^\\p{L}\\p{N}_@])@('+keys.join('|')+')(?![\\p{L}\\p{N}_])'};
 return _mn;
}
function ecoParseMentions(text){
 const t=String(text||'').replace(/^\[\[(?:img|stk):[^\]]*\]\]\s*/,'');
 const ix=mnIndex(),re=new RegExp(ix.src,'giu'),ids=new Set();let all=false,m;
 while((m=re.exec(t))){const k=m[2].toLowerCase(),us=ix.map.get(k);if(us)us.forEach(u=>ids.add(u.id));else if(k==='todos')all=true;}
 return{ids,all};
}
window.ecoParseMentions=ecoParseMentions;

/* ───────────────────────── Menciones: resaltado en pantalla ───────────────────────── */
const MN_SEL='.post .bd, .cm-t';
function authorOfEl(el){
 const cm=el.closest('.cm[data-cid]');let cid=cm&&cm.dataset.cid;
 if(!cid){const cb=el.closest('.comment-body'),x=cb&&cb.querySelector('[data-c]');cid=x&&x.dataset.c;}
 if(cid){for(const p of DB.posts){const c=(p.comments||[]).find(x=>x.id===cid);if(c)return c.userId;}return null;}
 const post=el.closest('.post[id^="post-"]');
 if(post){const p=postById(post.id.slice(5));return p?p.userId:null;}
 return null;
}
function markEl(el,ix){
 el.dataset.mn=ix.sig;
 const aId=authorOfEl(el),au=aId?userById(aId):null,allOk=!!au&&ECO_ALL_ROLES.includes(au.role);
 const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null),nodes=[];let n;
 while((n=w.nextNode())){if(n.nodeValue.indexOf('@')>=0&&!(n.parentNode.closest&&n.parentNode.closest('.eco-mn')))nodes.push(n);}
 nodes.forEach(tn=>{
  const txt=tn.nodeValue,re=new RegExp(ix.src,'giu');let m,last=0,frag=null;
  while((m=re.exec(txt))){
   const k=m[2].toLowerCase(),us=ix.map.get(k),isAll=!us&&k==='todos';
   if(isAll&&!allOk)continue;if(!us&&!isAll)continue;
   frag=frag||document.createDocumentFragment();
   const start=m.index+m[1].length,label=txt.slice(start,start+1+m[2].length);
   if(start>last)frag.appendChild(document.createTextNode(txt.slice(last,start)));
   let node;
   if(isAll){node=document.createElement('span');node.className='eco-mn eco-mn-all';node.title='Aviso para toda la comunidad';}
   else{node=document.createElement('a');node.className='eco-mn';node.href='#/perfil/'+us[0].id;}
   node.textContent=label;frag.appendChild(node);last=start+label.length;
  }
  if(frag){if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));tn.parentNode.replaceChild(frag,tn);}
 });
}
let _scanQ=false;
function scanMentions(){
 _scanQ=false;
 try{const ix=mnIndex();document.querySelectorAll(MN_SEL).forEach(el=>{if(el.dataset.mn!==ix.sig)markEl(el,ix);});}
 catch(e){console.warn('[EcoNova] menciones',e);}
}
new MutationObserver(()=>{if(!_scanQ){_scanQ=true;requestAnimationFrame(scanMentions);}}).observe(document.body,{childList:true,subtree:true});
scanMentions();

/* ───────────────────────── Menciones: autocompletado al escribir @ ───────────────────────── */
const FIELD_SEL='#np-body,#ep-body,#reply-body,.sf-row input,.cmt-form input,[data-mention]';
let pop=null,st=null,skipInput=false;
function mentionable(){
 const me=sess();
 return DB.users.filter(u=>u&&u.id&&u.id!=='?'&&(!me||u.id!==me.id)&&!u.suspended&&!u.banPermanent&&!(me&&((me.blockedUsers||[]).includes(u.id)||(u.blockedUsers||[]).includes(me.id))));
}
function candidates(q){
 const me=sess();if(!me)return[];
 const nq=norm(q.trim()),fol=new Set((DB.follows||[]).filter(f=>f.f===me.id).map(f=>f.t));
 let list=mentionable();if(nq)list=list.filter(u=>norm(u.name).includes(nq));
 list.sort((a,b)=>{const sa=norm(a.name).startsWith(nq)?0:1,sb=norm(b.name).startsWith(nq)?0:1;if(sa!==sb)return sa-sb;const fa=fol.has(a.id)?0:1,fb=fol.has(b.id)?0:1;if(fa!==fb)return fa-fb;return String(a.name).localeCompare(String(b.name),'es');});
 const out=list.map(u=>({id:u.id,u}));
 if(canMentionAll()&&'todos'.startsWith(nq))out.unshift({id:'all'});
 return out;
}
function caretCtx(el){
 const pos=el.selectionStart;if(pos==null)return null;
 const before=el.value.slice(0,pos);
 const m=/(^|[\s(¿¡,;:])@([\p{L}\p{N}_.'-]*(?: [\p{L}\p{N}_.'-]*){0,2})$/u.exec(before);
 if(!m)return null;
 const q=m[2],start=pos-(q.length+1);
 if(/ $/.test(q)){const t=q.trimEnd().toLowerCase();if(t==='todos'||mnIndex().map.has(t))return null;}
 return{q,start,end:pos};
}
function hidePop(){if(pop){pop.remove();pop=null;}st=null;}
function placePop(){
 if(!pop||!st)return;
 const sheet=st.el.closest&&st.el.closest('#eco-sheet');
 if(sheet){
  const sh=sheet.querySelector('.sh'),sl=sheet.querySelector('.sl'),em=sheet.querySelector('.sf-emojis')||st.el.closest('form');
  if(sh&&sl&&em){
   const a=sh.getBoundingClientRect(),b=sl.getBoundingClientRect(),c2=em.getBoundingClientRect(),hh=c2.top-b.top;
   if(hh>=96){pop.classList.add('in-sheet');pop.style.left=a.left+'px';pop.style.width=a.width+'px';pop.style.top=b.top+'px';pop.style.bottom='auto';pop.style.height=hh+'px';return;}
  }
 }
 pop.classList.remove('in-sheet');pop.style.height='';
 const r=st.el.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight;
 const w=Math.min(Math.max(r.width,270),380,vw-16),left=Math.max(8,Math.min(r.left,vw-w-8));
 pop.style.width=w+'px';pop.style.left=left+'px';
 const h=pop.offsetHeight,below=vh-r.bottom,above=r.top;
 if(st.el.matches('.sf-row input,.cmt-form input')||(below<h+16&&above>below)){pop.style.top='auto';pop.style.bottom=(vh-r.top+8)+'px';}
 else{pop.style.bottom='auto';pop.style.top=(r.bottom+8)+'px';}
}
function renderPop(){
 if(!st)return;
 const items=st.items;
 if(!items.length){hidePop();return;}
 if(!pop){pop=document.createElement('div');pop.className='eco-mn-pop';pop.setAttribute('role','listbox');
  pop.addEventListener('mousedown',e=>e.preventDefault());ecoTrapScroll(pop);
  pop.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(b){e.preventDefault();e.stopPropagation();pickMention(b.dataset.pick);}});
  document.body.appendChild(pop);}
 pop.innerHTML=items.map((it,i)=>{
  if(it.id==='all')return`<button type="button" class="eco-mn-it all${i===st.idx?' sel':''}" data-pick="all" role="option"><span class="eco-mn-all-ic">${SVG('<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/>')}</span><span class="t"><b><span>@todos</span></b><small>Avisar a toda la comunidad</small></span></button>`;
  const u=it.u,hd=String(u.email||'').split('@')[0].toLowerCase().replace(/[^a-z0-9._-]/g,''),sub=u.kind==='ORG'?'Organización':u.kind==='EMPRESA'?'Empresa aliada':(u.loc||(hd?'@'+hd:''));
  return`<button type="button" class="eco-mn-it${i===st.idx?' sel':''}" data-pick="${esc(u.id)}" role="option">${avatar(u,48,16)}<span class="t"><b><span>${esc(u.name)}</span>${u.verified?VERIFIED:''}</b>${sub?`<small>${esc(sub)}</small>`:''}</span></button>`;
 }).join('');
 placePop();
}
function updateMention(el){
 if(skipInput){skipInput=false;return;}
 const ctx=caretCtx(el);
 if(!ctx||!sess()){hidePop();return;}
 const items=candidates(ctx.q);
 st={el,start:ctx.start,end:ctx.end,items,idx:0};
 renderPop();
}
function pickMention(val){
 if(!st)return;
 const el=st.el,name=val==='all'?'todos':(userById(val).name||''),ins='@'+name+' ';
 const v=el.value,max=+el.getAttribute('maxlength')||0;
 let nv=v.slice(0,st.start)+ins+v.slice(st.end);
 if(max&&nv.length>max){toast('No cabe la mención en el límite de caracteres.','err');hidePop();return;}
 el.value=nv;const pos=st.start+ins.length;
 try{el.setSelectionRange(pos,pos);}catch(_){}
 hidePop();skipInput=true;el.dispatchEvent(new Event('input',{bubbles:true}));skipInput=false;el.focus();
}
document.addEventListener('input',e=>{const t=e.target;if(t&&t.matches&&t.matches(FIELD_SEL))updateMention(t);});
document.addEventListener('click',e=>{if(!pop)return;if(e.target.closest&&(e.target.closest('.eco-mn-pop')||(st&&e.target===st.el)))return;hidePop();},true);
document.addEventListener('keyup',e=>{const t=e.target;if(pop&&st&&t===st.el&&(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='Home'||e.key==='End'))updateMention(t);});
document.addEventListener('focusout',e=>{if(st&&e.target===st.el)setTimeout(()=>{if(document.activeElement!==(st&&st.el))hidePop();},180);});
document.addEventListener('keydown',e=>{
 if(!pop||!st||e.target!==st.el)return;
 const n=st.items.length;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();st.idx=(st.idx+(e.key==='ArrowDown'?1:-1)+n)%n;renderPop();}
 else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();pickMention(st.items[st.idx].id);}
 else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();hidePop();}
},true);
addEventListener('resize',()=>placePop());
addEventListener('scroll',()=>placePop(),true);
if(window.visualViewport){visualViewport.addEventListener('resize',()=>placePop());visualViewport.addEventListener('scroll',()=>placePop());}
addEventListener('hashchange',hidePop);

/* ───────────────────────── Menciones: notificaciones ───────────────────────── */
let _warnedNotif=false;
async function ecoNotifyMentions(postId,text,kind,prevText){
 const me=sess();if(!me||!postId||!text)return;
 const cur=ecoParseMentions(text),old=prevText?ecoParseMentions(prevText):{ids:new Set(),all:false};
 const all=cur.all&&canMentionAll()&&!old.all,post=postById(postId);
 let ids=[...cur.ids].filter(id=>id!==me.id&&!old.ids.has(id));
 if(kind==='comment'&&post)ids=ids.filter(id=>id!==post.userId); /* el autor ya recibe el aviso normal de comentario */
 if(!all&&!ids.length)return;
 ids=ids.slice(0,10);
 if(cloudOn()&&realUser()&&UUID.test(postId)){
  try{
   const {error}=await supabaseClient.rpc('eco_notify_mentions',{p_post_id:postId,p_kind:kind,p_user_ids:all?[]:ids,p_all:all});
   if(error)throw error;
   if(all)toast('Aviso enviado a toda la comunidad.','ok');
  }catch(e){
   console.warn('[EcoNova] No se pudieron enviar las menciones',e);
   if(!_warnedNotif&&isDeveloper()){_warnedNotif=true;toast('La mención se publicó, pero no se pudo notificar: falta ejecutar el SQL de menciones en Supabase.','err');}
  }
  return;
 }
 /* Modo local (sin Supabase) */
 const type=(all?'mention_all':'mention')+(kind==='comment'?'_comment':'');
 const targets=all?DB.users.filter(u=>u.id!==me.id).map(u=>u.id):ids;
 const title=all?'Aviso para toda la comunidad':kind==='comment'?'Te mencionaron en un comentario':'Te mencionaron';
 const body=all?`${me.name} tiene un aviso para la comunidad. Revísalo.`:`${me.name} te mencionó${post?` en "${post.title}"`:''}.`;
 targets.forEach(id=>API.notify(id,title,body,{type,postId,actorId:me.id}));
 save();
}
window.ecoNotifyMentions=ecoNotifyMentions;

if(typeof API==='object'){
 const _cp=API.createPost;
 API.createPost=async function(d){
  const p=await _cp.apply(API,arguments);
  try{if(p&&p.status==='APPROVED')ecoNotifyMentions(p.id,(p.title||'')+'\n'+(p.body||''),'post');}catch(e){console.warn(e);}
  return p;
 };
 ['comment','replyComment'].forEach(k=>{
  const o=API[k];
  API[k]=function(){
   const r=o.apply(this,arguments);
   try{ecoNotifyMentions(arguments[0],arguments[k==='comment'?1:2],'comment');}catch(e){console.warn(e);}
   return r;
  };
 });
}
if(typeof Cloud==='object'&&Cloud&&typeof Cloud.notifView==='function'){
 const _nv=Cloud.notifView;
 Cloud.notifView=function(n){
  if(!n||!/^mention/.test(String(n.type||'')))return _nv.apply(this,arguments);
  const v=_nv.call(this,Object.assign({},n,{type:'comment'}));
  const a=DB.users.find(x=>x.id===n.actor_id),nm=a?a.name:'Alguien',pp=DB.posts.find(x=>x.id===n.post_id),t=pp?pp.title:'una publicación';
  const all=/^mention_all/.test(n.type),cm=/_comment$/.test(n.type);
  v.type=n.type;
  v.title=all?'Aviso para toda la comunidad':cm?'Te mencionaron en un comentario':'Te mencionaron';
  v.body=all?`${nm} tiene un aviso para la comunidad en "${t}". Revísalo.`:`${nm} te mencionó ${cm?'en un comentario de':'en'} "${t}".`;
  return v;
 };
}

let _elkEsc=null;
function closeLikes(){

async function fetchMissing(ids){
 const out={};if(!ids.length||!cloudOn())return out;
 try{

function openLikes(pid){
 const p=postById(pid);if(!p)return;
 closeLikes();hidePop();
 const me=sess();
 const ids=[...new Set((p.likes||[]).filter(Boolean))];
 const wrap=document.createElement('div');wrap.id='eco-likes';
 const n=ids.length;
 wrap.innerHTML=`<div class="elk-sh" role="dialog" aria-modal="true" aria-label="Personas a quienes les gustó"><div class="elk-grab"><i></i></div><div class="elk-head"><span class="elk-ico">${HEART}</span><div class="elk-tt"><h4>Me gusta</h4><span class="elk-count"></span></div><button type="button" class="elk-x" data-elk-close aria-label="Cerrar">✕</button></div>${n>7?'<div class="elk-search"><input type="search" placeholder="Buscar por nombre" aria-label="Buscar por nombre" autocomplete="off"></div>':''}<div class="elk-list" tabindex="-1"></div></div>`;
 document.body.appendChild(wrap);ecoLockPage('likes');ecoTrapScroll(wrap);
 const sh=wrap.querySelector('.elk-sh'),list=wrap.querySelector('.elk-list'),cnt=wrap.querySelector('.elk-count');
 const extra={};
 const isF=id=>!!me&&(DB.follows||[]).some(f=>f.f===me.id&&f.t===id);
 const blocked=u=>!!me&&u.id!==me.id&&((me.blockedUsers||[]).includes(u.id)||(u.blockedUsers||[]).includes(me.id));
 const getU=id=>DB.users.find(u=>u.id===id)||extra[id]||null;
 const sub=u=>u.id===(me&&me.id)?'':u.kind==='ORG'?'Organización':u.kind==='EMPRESA'?'Empresa aliada':(u.loc||(u.bio?String(u.bio).slice(0,60):''));
 function view(filter){
  let us=ids.map(getU).filter(u=>u&&!blocked(u));

  if(!total&&!ids.length){
   list.innerHTML=`<div class="elk-empty"><span class="big">${SVG('<path d="M12 20s-7.5-4.7-9.4-9C1.2 7.7 3.6 4 7 4c2 0 3.8 1.1 5 3 1.2-1.9 3-3 5-3 3.4 0 5.8 3.7 4.4 7-1.9 4.3-9.4 9-9.4 9z"/>')}</span><b>Aún no hay me gusta</b><span>Sé la primera persona en reaccionar a esta publicación.</span>${me&&!locked(p)?`<button type="button" class="btn btn-green btn-sm" data-elk-like>Dar me gusta</button>`:''}</div>`;return;
  }
  const q=norm(filter||'');if(q)us=us.filter(u=>norm(u.name).includes(q));
  us.sort((a,b)=>{const ra=me&&a.id===me.id?0:isF(a.id)?1:2,rb=me&&b.id===me.id?0:isF(b.id)?1:2;if(ra!==rb)return ra-rb;return String(a.name).localeCompare(String(b.name),'es');});
  if(!us.length){list.innerHTML='<div class="elk-none">No hay resultados.</div>';return;}
  list.innerHTML=us.map(u=>{
   const self=me&&u.id===me.id,s=sub(u),real=UUID.test(u.id)||!!DB.users.find(x=>x.id===u.id);
   return`<div class="elk-row" data-u="${esc(u.id)}"><a class="elk-av" href="#/perfil/${esc(u.id)}" data-elk-go>${avatar(u,48,16)}<span class="elk-heart">${HEART}</span></a><a class="elk-meta" href="#/perfil/${esc(u.id)}" data-elk-go><span class="n"><b>${esc(u.name)}</b>${u.verified?VERIFIED:''}</span>${s?`<small>${esc(s)}</small>`:''}</a>${self?'<span class="elk-you">Tú</span>':me&&real?`<button type="button" class="elk-fol${isF(u.id)?' on':''}" data-elk-fol="${esc(u.id)}">${isF(u.id)?'Siguiendo':'Seguir'}</button>`:''}</div>`;
  }).join('');
 }
 view('');
 const missing=ids.filter(id=>!DB.users.some(u=>u.id===id));
 if(missing.length)fetchMissing(missing).then(r=>{if(!document.getElementById('eco-likes'))return;Object.assign(extra,r);const s=wrap.querySelector('.elk-search input');view(s?s.value:'');});
 const si=wrap.querySelector('.elk-search input');if(si)si.addEventListener('input',()=>view(si.value));
 wrap.addEventListener('click',e=>{
  if(e.target===wrap||e.target.closest('[data-elk-close]')){closeLikes();return;}
  if(e.target.closest('[data-elk-go]')){closeLikes();return;}
  const lk=e.target.closest('[data-elk-like]');
  if(lk){const b=document.querySelector(`button[data-action="like"][data-p="${CSS.escape(String(pid))}"]`);closeLikes();if(b)b.click();return;}
  const f=e.target.closest('[data-elk-fol]');
  if(f){
   if(!sess())return guard();
   try{
    const on=API.toggleFollow(f.dataset.elkFol);
    f.classList.toggle('on',!!on);f.textContent=on?'Siguiendo':'Seguir';
    if(on)toast('Ahora sigues a esta cuenta.','ok');
   }catch(m){toast(String(m&&m.message||m),'err');}
  }
 });
 /* arrastrar hacia abajo para cerrar */
 let y0=null,dy=0;
 const grab=sh.querySelector('.elk-grab'),head=sh.querySelector('.elk-head');
 [grab,head].forEach(el=>{
  el.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;dy=0;sh.style.transition='none';},{passive:true});
  el.addEventListener('touchmove',e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform=`translateY(${dy}px)`;},{passive:true});
  const end=()=>{if(y0==null)return;y0=null;sh.style.transition='transform .2s ease';if(dy>90){closeLikes();}else{sh.style.transform='';}};
  el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);
 });
 _elkEsc=e=>{if(e.key==='Escape'){e.stopPropagation();closeLikes();}};
 document.addEventListener('keydown',_elkEsc,true);
 const xb=wrap.querySelector('.elk-x');if(xb)xb.focus({preventScroll:true});
}
addEventListener('hashchange',closeLikes);
window.addEventListener('click',e=>{
 const nEl=e.target.closest&&e.target.closest('.eco-likes-n');
 if(nEl){const p=postById(nEl.dataset.likesOpen);if(p&&(p.likes||[]).length){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();openLikes(p.id);}}
},true);
window.addEventListener('keydown',e=>{
 if(e.key!=='Enter'&&e.key!==' ')return;
 const nEl=e.target.closest&&e.target.closest('.eco-likes-n');
 if(nEl){const p=postById(nEl.dataset.likesOpen);if(p&&(p.likes||[]).length){e.preventDefault();e.stopPropagation();openLikes(p.id);}}
},true);

/* ───────────────────────── Editar publicaciones ───────────────────────── */
const canEdit=p=>{const u=sess();return !!u&&!!p&&!p.sharedFrom&&!['REMOVED','REJECTED'].includes(p.status)&&(p.userId===u.id||isDeveloper());};
function openEdit(pid){
 const p=postById(pid);if(!p)return;
 if(!sess())return guard();
 if(!canEdit(p)){toast('No tienes permiso para editar esta publicación.','err');return;}
 const imgs=(p.imgs||[]).map(u=>`<div class="eco-ed-m" data-eco-img="${esc(u)}"><img src="${esc(u)}" alt="" loading="lazy"><button type="button" data-eco-rm aria-label="Quitar foto" title="Quitar foto">✕</button></div>`).join('');
 const vid=p.video?`<div class="eco-ed-m" data-eco-vid="1"><video src="${esc(p.video)}#t=0.1" muted playsinline preload="metadata"></video><span class="tag">Video</span><button type="button" data-eco-rm aria-label="Quitar video" title="Quitar video">✕</button></div>`:'';
 modal(`<h3>Editar publicación</h3><p class="sm mut mb2">Los cambios se publican al instante y la publicación mostrará “editado”.</p>
 <form data-eco-form="edit-post" data-p="${esc(p.id)}" novalidate>
  <div class="field"><label>Título</label><input type="text" id="ep-title" maxlength="160" required value="${esc(p.title)}"></div>
  <div class="field"><label>Descripción</label><textarea id="ep-body" maxlength="4000" required style="min-height:140px">${esc(p.body)}</textarea><div class="xs mut mt1">Escribe @ para mencionar a alguien.</div></div>
  <div class="field"><label>Categoría</label><select id="ep-cat" required>${catOptions(p.cat)}</select></div>
  <div class="field"><label>Ubicación (opcional)</label><input type="text" id="ep-loc" value="${esc(p.loc||'')}"></div>
  ${imgs||vid?`<div class="field"><label>Fotos y video</label><div class="eco-ed-media">${imgs}${vid}</div><div class="xs mut mt1">Toca ✕ para quitar. Para añadir fotos nuevas, crea otra publicación.</div></div>`:''}
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-green" type="submit" data-eco-save>Guardar cambios</button><button class="btn btn-ghost" type="button" data-action="close-modal">Cancelar</button></div>
 </form>`);
}
async function catUuid(catId){
 const cat=DB.cats.find(c=>c.id===catId);if(!cat)return null;
 const {data}=await supabaseClient.from('categories').select('id,name');
 const r=(data||[]).find(x=>String(x.name||'').toLowerCase()===cat.name.toLowerCase());return r?r.id:null;
}
async function saveEdit(f){
 const pid=f.dataset.p,p=postById(pid),u=sess();
 if(!p||!u)throw new Error('Publicación no encontrada.');
 if(!canEdit(p))throw new Error('No tienes permiso para editar esta publicación.');
 const title=f.querySelector('#ep-title').value.trim(),body=f.querySelector('#ep-body').value.trim(),cat=+f.querySelector('#ep-cat').value,loc=f.querySelector('#ep-loc').value.trim();
 if(!title)throw new Error('Escribe un título.');if(!body)throw new Error('Escribe una descripción.');if(!cat)throw new Error('Elige una categoría.');
 const rmImgs=[...f.querySelectorAll('[data-eco-img].gone')].map(x=>x.dataset.ecoImg);
 const rmVid=!!f.querySelector('[data-eco-vid].gone');
 const oldText=(p.title||'')+'\n'+(p.body||'');
 if(cloudOn()&&realUser()&&UUID.test(p.id)){
  const patch={content:title+'\n\n'+body,location:loc||null,edited_at:new Date().toISOString()};
  if(cat!==p.cat){const cu=await catUuid(cat);if(!cu)throw new Error('La categoría elegida no está disponible en Supabase. Recarga la página.');patch.category_id=cu;}
  let r=await supabaseClient.from('posts').update(patch).eq('id',p.id).select('id');
  if(r.error&&/edited_at/i.test(String(r.error.message||''))){delete patch.edited_at;r=await supabaseClient.from('posts').update(patch).eq('id',p.id).select('id');}
  if(r.error)throw new Error('No se pudo guardar: '+(r.error.message||r.error.code));
  if(!r.data||!r.data.length)throw new Error('El servidor no aceptó el cambio. Falta la política UPDATE en la tabla posts para el autor.');
  for(const url of rmImgs){const d=await supabaseClient.from('post_media').delete().eq('post_id',p.id).eq('media_url',url);if(d.error)console.warn('[EcoNova] foto no quitada',d.error);}
  if(rmVid){const d=await supabaseClient.from('post_media').delete().eq('post_id',p.id).eq('media_type','video');if(d.error)console.warn('[EcoNova] video no quitado',d.error);}
 }
 p.title=title;p.body=body;p.cat=cat;p.loc=loc;p.editedAt=Date.now();
 p.tags=(body.match(/#[\wáéíóúñÁÉÍÓÚÑ]+/g)||[]).map(t=>t.slice(1));
 if(rmImgs.length)p.imgs=(p.imgs||[]).filter(x=>!rmImgs.includes(x));
 if(rmVid)p.video='';
 save();
 if(p.status==='APPROVED')ecoNotifyMentions(p.id,title+'\n'+body,'post',oldText);
}
window.addEventListener('click',e=>{
 const eb=e.target.closest&&e.target.closest('[data-eco-edit]');
 if(eb){e.preventDefault();e.stopPropagation();const id=eb.dataset.ecoEdit;closeModal();openEdit(id);return;}
 const rm=e.target.closest&&e.target.closest('[data-eco-rm]');
 if(rm){e.preventDefault();e.stopPropagation();const tile=rm.closest('.eco-ed-m');if(tile){const g=tile.classList.toggle('gone');rm.textContent=g?'↺':'✕';rm.setAttribute('aria-label',g?'Restaurar':'Quitar');}}
},true);
window.addEventListener('submit',async e=>{
 const f=e.target;if(!f.matches||!f.matches('[data-eco-form="edit-post"]'))return;
 e.preventDefault();e.stopPropagation();
 const btn=f.querySelector('[data-eco-save]');if(btn&&btn.disabled)return;
 if(btn){btn.disabled=true;btn.textContent='Guardando…';}
 try{await saveEdit(f);closeModal();toast('Cambios guardados.','ok');render();}
 catch(err){toast(String(err&&err.message||err),'err');if(btn){btn.disabled=false;btn.textContent='Guardar cambios';}}
},true);

/* ───────────────────────── Reproductor de video ───────────────────────── */
const vOf=box=>box.querySelector('video[data-eco-video]');
function showCtl(box){
 box.classList.add('evp-show');clearTimeout(box._ht);
 const v=vOf(box);if(v&&!v.paused&&!box._scrub)box._ht=setTimeout(()=>box.classList.remove('evp-show'),2600);
}
function toggleV(box){
 const v=vOf(box);if(!v)return;
 if(typeof ecoLoadVideo==='function')ecoLoadVideo(v);
 const willPlay=v.paused||v.ended;
 if(willPlay){
  delete v.dataset.userPaused;
  const pr=v.play();
  if(pr&&pr.catch)pr.catch(()=>{if(!box.querySelector('.video-error'))box.insertAdjacentHTML('beforeend','<div class="video-error">No se pudo reproducir. Comprueba el formato del video o vuelve a intentarlo.</div>');});
 }else{v.dataset.userPaused='1';v.pause();}
 const fl=box.querySelector('.evp-flash');
 if(fl){fl.innerHTML=willPlay?EVP_I.play:EVP_I.pause;fl.classList.remove('on');void fl.offsetWidth;fl.classList.add('on');}
 showCtl(box);
}
function seekBy(box,d){
 const v=vOf(box);if(!v)return;
 if(typeof ecoLoadVideo==='function')ecoLoadVideo(v);
 const go=()=>{if(Number.isFinite(v.duration)&&v.duration>0)v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+d));};
 if(Number.isFinite(v.duration)&&v.duration>0)go();else v.addEventListener('loadedmetadata',go,{once:true});
 const fx=box.querySelector(d<0?'.evp-fx-l':'.evp-fx-r');
 if(fx){fx.classList.remove('on');void fx.offsetWidth;fx.classList.add('on');}
 showCtl(box);
}
function toggleFS(box){
 const v=vOf(box),cur=document.fullscreenElement||document.webkitFullscreenElement;
 if(cur){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}
 const req=box.requestFullscreen||box.webkitRequestFullscreen;
 if(req)req.call(box);else if(v&&v.webkitEnterFullscreen)v.webkitEnterFullscreen();
}
function onFS(){const cur=document.fullscreenElement||document.webkitFullscreenElement;document.querySelectorAll('.evp').forEach(b=>b.classList.toggle('is-fs',b===cur));}
document.addEventListener('fullscreenchange',onFS);document.addEventListener('webkitfullscreenchange',onFS);

let _tap={t:0,z:0,box:null,timer:null};
document.addEventListener('click',e=>{
 const t=e.target;if(!t.closest)return;
 const sf=t.closest('.evp-surface');
 if(sf){
  const box=sf.closest('.evp'),r=sf.getBoundingClientRect(),x=e.clientX-r.left,z=x<r.width*.34?-1:x>r.width*.66?1:0,now=Date.now();
  if(z!==0&&_tap.box===box&&_tap.z===z&&now-_tap.t<320){clearTimeout(_tap.timer);_tap.t=0;seekBy(box,z*10);return;}
  clearTimeout(_tap.timer);
  if(z===0){_tap={t:0,z:0,box,timer:null};toggleV(box);}
  else{_tap={t:now,z,box,timer:setTimeout(()=>{_tap.t=0;toggleV(box);},270)};}
  return;
 }
 const sk=t.closest('.evp-skip');
 if(sk){const box=sk.closest('.evp');const back=sk.getAttribute('data-action')==='video-back';const fx=box.querySelector(back?'.evp-fx-l':'.evp-fx-r');if(fx){fx.classList.remove('on');void fx.offsetWidth;fx.classList.add('on');}showCtl(box);return;}
 const big=t.closest('.evp-big');if(big){showCtl(big.closest('.evp'));return;}
 const b=t.closest('[data-evp]');
 if(!b)return;
 const box=b.closest('.evp'),v=box&&vOf(box);if(!v)return;
 const k=b.dataset.evp;
 if(k==='pp'){toggleV(box);}
 else if(k==='speed'){const L=[1,1.25,1.5,2,.75],i=L.indexOf(v.playbackRate);v.playbackRate=L[(i+1)%L.length];syncVideoControls(v);showCtl(box);}
 else if(k==='mute'){v.muted=!v.muted;if(!v.muted&&v.volume===0)v.volume=1;syncVideoControls(v);showCtl(box);}
 else if(k==='fs'){toggleFS(box);}
},true);

function scrubTo(box,tr,x,commit){
 const v=vOf(box),r=tr.getBoundingClientRect(),pr=Math.min(1,Math.max(0,(x-r.left)/Math.max(1,r.width)));
 const f=box.querySelector('.evp-fill'),k=box.querySelector('.evp-knob'),cur=box.querySelector('.evp-cur');
 if(f)f.style.width=pr*100+'%';if(k)k.style.left=pr*100+'%';
 if(Number.isFinite(v.duration)&&v.duration>0){
  if(cur)cur.textContent=ecoFmtT(pr*v.duration);
  const now=Date.now();if(commit||now-(box._lastSeek||0)>120){box._lastSeek=now;v.currentTime=pr*v.duration;}
 }
}
document.addEventListener('pointerdown',e=>{
 const tr=e.target.closest&&e.target.closest('.evp-track');if(!tr)return;
 const box=tr.closest('.evp'),v=vOf(box);if(!v)return;
 if(typeof ecoLoadVideo==='function')ecoLoadVideo(v);
 box._scrub=true;box._tr=tr;box.classList.add('evp-scrub');
 try{tr.setPointerCapture(e.pointerId);}catch(_){}
 scrubTo(box,tr,e.clientX,false);e.preventDefault();
},true);
document.addEventListener('pointermove',e=>{
 const box=e.target.closest&&e.target.closest('.evp');
 if(box&&e.pointerType==='mouse'&&!box._scrub)showCtl(box);
 const sb=document.querySelector('.evp.evp-scrub');if(sb&&sb._scrub&&sb._tr)scrubTo(sb,sb._tr,e.clientX,false);
},true);
const endScrub=e=>{
 const sb=document.querySelector('.evp.evp-scrub');if(!sb)return;
 if(sb._tr&&e&&e.type==='pointerup')scrubTo(sb,sb._tr,e.clientX,true);
 sb._scrub=false;sb.classList.remove('evp-scrub');showCtl(sb);syncVideoControls(vOf(sb));
};
document.addEventListener('pointerup',endScrub,true);document.addEventListener('pointercancel',endScrub,true);
document.addEventListener('keydown',e=>{
 const box=e.target.closest&&e.target.closest('.evp');if(!box)return;
 const v=vOf(box);if(!v)return;
 const isBtn=e.target.closest('button');
 if((e.key===' '||e.key==='k'||e.key==='K')&&!isBtn){e.preventDefault();toggleV(box);}
 else if(e.key==='ArrowLeft'){e.preventDefault();seekBy(box,e.target.closest('.evp-track')?-5:-10);}
 else if(e.key==='ArrowRight'){e.preventDefault();seekBy(box,e.target.closest('.evp-track')?5:10);}
 else if(e.key==='m'||e.key==='M'){v.muted=!v.muted;syncVideoControls(v);}
 else if(e.key==='f'||e.key==='F'){toggleFS(box);}
},true);
['progress','durationchange','volumechange','ratechange','ended'].forEach(n=>document.addEventListener(n,e=>{const v=e.target;if(v&&v.matches&&v.matches('video[data-eco-video]'))syncVideoControls(v);},true));
['waiting','stalled'].forEach(n=>document.addEventListener(n,e=>{const v=e.target;if(v&&v.matches&&v.matches('video[data-eco-video]')){const b=v.closest('.evp');if(b)b.classList.add('is-wait');}},true));
['playing','canplay','seeked','pause'].forEach(n=>document.addEventListener(n,e=>{const v=e.target;if(v&&v.matches&&v.matches('video[data-eco-video]')){const b=v.closest('.evp');if(b)b.classList.remove('is-wait');}},true));
document.addEventListener('play',e=>{const v=e.target;if(v&&v.matches&&v.matches('video[data-eco-video]')){const b=v.closest('.evp');if(b)showCtl(b);}},true);
})();

</script>

<script id="econova-redesign-2-js">
(function(){
 var last=window.scrollY||0,tk=false;
 function upd(){
  var y=window.scrollY||document.documentElement.scrollTop||0,d=y-last;
  if(y<40)document.body.classList.remove('nav-hide');
  else if(d>8)document.body.classList.add('nav-hide');
  else if(d<-8)document.body.classList.remove('nav-hide');
  if(Math.abs(d)>8)last=y;
  tk=false;
 }
 window.addEventListener('scroll',function(){if(!tk){tk=true;requestAnimationFrame(upd);}},{passive:true});
 window.addEventListener('hashchange',function(){document.body.classList.remove('nav-hide');last=0;});
})();
</script>

<script id="econova-interaction-fixes">
(function(){
 'use strict';
 document.addEventListener('click',function(e){
    var btn=document.getElementById('np-dd-btn'),panel=document.getElementById('np-dd-panel');
    if(!btn||!panel)return;
    var opt=e.target.closest('[data-np-cat]');
    if(opt){
      var select=document.getElementById('np-cat'),label=document.getElementById('np-dd-label');
      if(select){select.value=opt.dataset.npCat;select.dispatchEvent(new Event('change',{bubbles:true}));}
      panel.querySelectorAll('.np-category-option').forEach(function(b){var on=b===opt;b.classList.toggle('is-selected',on);b.setAttribute('aria-selected',on?'true':'false');});
      if(label){label.textContent=opt.querySelector('span').textContent;label.classList.remove('is-empty');}
      ecoCatClose();try{btn.focus({preventScroll:true});}catch(_){}
      return;
    }
    if(e.target.closest('#np-dd-btn')){panel.classList.contains('is-open')?ecoCatClose():ecoCatOpen();return;}
    if(!e.target.closest('#np-dd-panel'))ecoCatClose();
  });
  function ecoCatOpen(){var b=document.getElementById('np-dd-btn'),p=document.getElementById('np-dd-panel');if(!b||!p)return;p.classList.add('is-open');b.setAttribute('aria-expanded','true');var sel=p.querySelector('.is-selected');if(sel)sel.scrollIntoView({block:'nearest'});}
  function ecoCatClose(){var b=document.getElementById('np-dd-btn'),p=document.getElementById('np-dd-panel');if(p)p.classList.remove('is-open');if(b)b.setAttribute('aria-expanded','false');}
  window.ecoCatDD={open:ecoCatOpen,close:ecoCatClose};
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){var p=document.getElementById('np-dd-panel');if(p&&p.classList.contains('is-open')){e.stopImmediatePropagation();ecoCatClose();var b=document.getElementById('np-dd-btn');if(b)b.focus({preventScroll:true});}}
    if(e.target&&e.target.id==='expq'&&e.key==='Enter'){e.preventDefault();e.target.blur();}
  },true);
 function clearExploreSearch(){
   var path=(location.hash||'#/').replace(/^#\//,'').split('/')[0];
   if(path!=='explorar'){
     if(typeof GQ!=='undefined')GQ='';
     var global=document.getElementById('global-search');if(global)global.value='';
     var explore=document.getElementById('expq');if(explore)explore.value='';
     if(window._qt){clearTimeout(window._qt);window._qt=null;}
   }
 }
 window.addEventListener('hashchange',function(){setTimeout(clearExploreSearch,0);});
})();
</script>
